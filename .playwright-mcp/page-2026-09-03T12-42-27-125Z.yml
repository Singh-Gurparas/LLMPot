- generic [ref=f21e1]: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><rss version=\"2.0\" xmlns:content=\"http://purl.org/rss/1.0/modules/content/\" xmlns:wfw=\"http://wellformedweb.org/CommentAPI/\" xmlns:dc=\"http://purl.org/dc/elements/1.1/\" xmlns:atom=\"http://www.w3.org/2005/Atom\" xmlns:sy=\"http://purl.org/rss/1.0/modules/syndication/\" xmlns:slash=\"http://purl.org/rss/1.0/modules/slash/\" > <channel> <title>Docker</title> <atom:link href=\"https://www.docker.com/feed/\" rel=\"self\" type=\"application/rss+xml\" /> <link>https://www.docker.com</link> <description></description> <lastBuildDate>Wed, 02 Sep 2026 15:02:44 +0000</lastBuildDate> <language>en-US</language> <sy:updatePeriod> hourly </sy:updatePeriod> <sy:updateFrequency> 1 </sy:updateFrequency> <generator>https://wordpress.org/?v=7.0.4</generator> <image> <url>https://www.docker.com/app/uploads/2024/02/cropped-docker-logo-favicon-32x32.png</url> <title>Docker</title> <link>https://www.docker.com</link> <width>32</width> <height>32</height> </image> <item> <title>Building Reproducible AI Evaluation Workflows with Docker Sandboxes</title> <link>https://www.docker.com/blog/building-reproducible-ai-evaluation-workflows-with-docker-sandboxes/</link> <dc:creator><![CDATA[Jennifer Kohl]]></dc:creator> <pubDate>Wed, 02 Sep 2026 13:00:00 +0000</pubDate> <category><![CDATA[Community]]></category> <category><![CDATA[AI Agent]]></category> <category><![CDATA[AI/ML]]></category> <category><![CDATA[Docker Sandboxes]]></category> <category><![CDATA[GenAI]]></category> <guid isPermaLink=\"false\">https://www.docker.com/?p=93401</guid> <description><![CDATA[Learn how Docker Sandboxes can make AI evaluation workflows more reproducible with consistent execution, structured artifacts, and runtime evidence.]]></description> <content:encoded><![CDATA[ <p class=\"wp-block-paragraph\">AI evaluation has never been easier to start. Reproducing it reliably is another story. Developers now have access to more benchmarks, evaluation libraries, model APIs, and agent frameworks than ever before. But keeping the prompt, model, and scoring method fixed doesn&#8217;t necessarily make a run reproducible. The execution environment matters too.</p> <p class=\"wp-block-paragraph\">Python dependencies change. Local tools drift. Setup steps go undocumented. A workflow that succeeds on one machine may behave differently on another. Most discussions about evaluation focus on <em>what</em> should be measured: benchmarks, scoring methods, or judge models. Much less attention is given to <em>how</em> those evaluations are executed. Yet that execution layer often determines whether someone else can reproduce the same workflow weeks or months later.</p> <p class=\"wp-block-paragraph\">When I started exploring Docker Sandboxes, I wasn&#8217;t trying to build another evaluation framework. I had a much smaller question.</p> <figure class=\"wp-block-pullquote\"><blockquote><p><strong>Could Docker Sandboxes and an SBX Kit make evaluation workflows easier to rerun, inspect, and compare?</strong></p></blockquote></figure> <p class=\"wp-block-paragraph\">That question eventually became the <a href=\"https://github.com/karanverma/sbx-ai-eval-kit\" id=\"dkr_sbx-ai-evaluation-kit-93401\" rel=\"nofollow noopener\" target=\"_blank\"><strong>SBX AI Evaluation Kit</strong></a><strong>,</strong> an open-source Docker Sandboxes Mixin Kit focused on repeatable execution, structured evaluation records, and runtime evidence. The current <em>implementation </em>does not execute AI models or automatically derive evaluation judgments. Instead, it executes configured commands consistently and preserves evidence of what actually ran.</p> <h2 class=\"wp-block-heading\">In Practice</h2> <p class=\"wp-block-paragraph\">In practice, the workflow starts by choosing where the evaluation command should run through the <code>execution</code> block:</p> <div class=\"wp-block-syntaxhighlighter-code \"><pre class=\"brush: yaml; gutter: false; title: ; notranslate\"> execution: executor: sbx command: - python3 - -c - print(&quot;hello from sbx&quot;) </pre></div> <p class=\"wp-block-paragraph\">With <code>executor: sbx</code>, the runner delegates command execution to Docker Sandboxes and writes the runtime evidence into the resulting artifact.</p> <p class=\"wp-block-paragraph\">The repository is also packaged as an SBX Mixin Kit, so it can be applied when starting a Claude sandbox:</p> <div class=\"wp-block-syntaxhighlighter-code \"><pre class=\"brush: bash; gutter: false; title: ; notranslate\"> sbx run claude --kit . </pre></div> <p class=\"wp-block-paragraph\">The runner reads the configured executor and delegates the command to SBX, which executes it inside the sandbox:</p> <div class=\"wp-block-syntaxhighlighter-code \"><pre class=\"brush: bash; gutter: false; title: ; notranslate\"> python run_evaluation.py </pre></div> <h2 class=\"wp-block-heading\">From Documentation to an Executable Workflow</h2> <p class=\"wp-block-paragraph\">Each evaluation is defined in a YAML file that describes the evaluation and the command to run. The repository validates that definition, executes it, and produces a structured JSON record of the result. The difference is in what gets recorded. A written evaluation captures what someone intended to do. An execution-backed evaluation captures what actually happened.</p> <h2 class=\"wp-block-heading\">Separating Evaluation from Execution</h2> <p class=\"wp-block-paragraph\">I wanted the evaluation definition to stay independent of where it ran. A workflow written during local development shouldn&#8217;t need to change simply because it later executes inside Docker Sandboxes.</p> <p class=\"wp-block-paragraph\">To keep those concerns separate, I introduced an executor abstraction. <strong>The evaluation describes what should run; the executor determines where it runs.</strong></p> <p class=\"wp-block-paragraph\">With the local executor, the configured command runs on the host. With the SBX executor, command execution is delegated to Docker Sandboxes. Switching between the two only requires changing the executor configuration, not rewriting the surrounding evaluation workflow.</p> <div class=\"wp-block-ponyo-image\"> <img fetchpriority=\"high\" decoding=\"async\" width=\"1536\" height=\"1024\" src=\"https://www.docker.com/app/uploads/2026/09/image1.png\" class=\"fade-in\" alt=\"image1\" srcset=\"https://www.docker.com/app/uploads/2026/09/image1.png 1536w, https://www.docker.com/app/uploads/2026/09/image1-600x400.png 600w, https://www.docker.com/app/uploads/2026/09/image1-250x167.png 250w, https://www.docker.com/app/uploads/2026/09/image1-64x43.png 64w\" sizes=\"(max-width: 1536px) 100vw, 1536px\" title=\"- image1\"> </div> <p class=\"wp-block-paragraph\"><em>Figure 1. Evaluation definitions remain independent of the execution environment. The same workflow can use either the local or SBX executor while producing runtime evidence in the same structure.</em></p> <h2 class=\"wp-block-heading\">Capturing Evidence Instead of Assumptions</h2> <p class=\"wp-block-paragraph\">For each execution, the runner records enough information to inspect what actually happened:</p> <ul class=\"wp-block-list\"> <li>the selected executor,</li> <li>the command that was executed,</li> <li>standard output (<code>stdout</code>) and standard error (<code>stderr</code>),</li> <li>the exit code,</li> <li>and the execution time.</li> </ul> <p class=\"wp-block-paragraph\">These details are stored in the evaluation artifact. The repository also generates a digest of the evaluation configuration. This creates a deterministic link between the evaluation configuration and the artifact it produced, without trying to replace full experiment-tracking systems.</p> <div class=\"wp-block-syntaxhighlighter-code \"><pre class=\"brush: jscript; gutter: false; title: ; notranslate\"> { &quot;executor&quot;: &quot;sbx&quot;, &quot;command&quot;: &#x5B;&quot;python3&quot;, &quot;-c&quot;, &quot;print(\\&quot;hello from sbx\\&quot;)&quot;], &quot;stdout&quot;: &quot;hello from sbx\\n&quot;, &quot;stderr&quot;: &quot;&quot;, &quot;exit_code&quot;: 0, &quot;duration_ms&quot;: 120.0 } </pre></div> <h2 class=\"wp-block-heading\">Scaling from One Evaluation to Many</h2> <p class=\"wp-block-paragraph\">Real-world evaluation rarely consists of one isolated run. Teams compare prompts, validate behavior, measure regressions between releases, and test multiple scenarios. That led to evaluation suites.</p> <p class=\"wp-block-paragraph\">Rather than changing how an individual evaluation works, a suite groups multiple evaluation definitions into a single repeatable workflow. Each evaluation still produces its own structured artifact, while the suite also generates an aggregated summary of the overall run.</p> <h2 class=\"wp-block-heading\">Reusable SBX Kits Beyond Evaluation</h2> <p class=\"wp-block-paragraph\">The same pattern isn&#8217;t limited to evaluation. An SBX Kit can package more than a development environment; it can also package the setup an engineering workflow depends on. The same model could support regression testing, policy checks, security analysis, code-generation experiments, and other workflows that depend on consistent execution and inspectable results.</p> <h2 class=\"wp-block-heading\">Conclusion</h2> <p class=\"wp-block-paragraph\">The SBX AI Evaluation Kit doesn&#8217;t replace evaluation frameworks, benchmarks, or scoring systems. Its job is narrower: execute configured evaluation workflows in a way that is easier to rerun and inspect.</p> <p class=\"wp-block-paragraph\">The question I came away with is simple: before comparing benchmark scores or choosing a judge model, can someone else reliably run the same workflow under comparable conditions?</p> <p class=\"wp-block-paragraph\">You can explore the code, experiment with custom evaluation YAMLs, and run the workflow yourself in the<a href=\"https://github.com/karanverma/sbx-ai-eval-kit\" id=\"dkr_-sbx-ai-eval-kit-repository-on-github-93401\" rel=\"nofollow noopener\" target=\"_blank\"> sbx-ai-eval-kit repository on GitHub</a>.</p> <h2 class=\"wp-block-heading\">Resources</h2> <ul class=\"wp-block-list\"> <li><a href=\"https://github.com/karanverma/sbx-ai-eval-kit\" id=\"dkr_sbx-ai-evaluation-kit-93401-2\" rel=\"nofollow noopener\" target=\"_blank\"><strong>SBX AI Evaluation Kit</strong></a> &#8211; Source code, example evaluation definitions, and the implementation described in this article.</li> <li><a href=\"https://docs.docker.com/ai/sandboxes/\" id=\"dkr_docker-sandboxes-documentation-93401\" rel=\"nofollow noopener\" target=\"_blank\"><strong>Docker Sandboxes documentation</strong></a> &#8211; Official documentation for setting up and running Docker Sandboxes.</li> <li><a href=\"https://docs.docker.com/ai/sandboxes/customize/kits/\" id=\"dkr_customizing-docker-sandboxes-with-kits-93401\" rel=\"nofollow noopener\" target=\"_blank\"><strong>Customizing Docker Sandboxes with Kits</strong></a> &#8211; Official documentation for extending Docker Sandboxes with reusable Kits.</li> </ul> <p class=\"wp-block-paragraph\"></p> ]]></content:encoded> </item> <item> <title>Below the Harness: Governing a Multi-Model, Multi-Harness World</title> <link>https://www.docker.com/blog/below-the-harness-governing-a-multi-model-multi-harness-world/</link> <dc:creator><![CDATA[Srini Sekaran]]></dc:creator> <pubDate>Wed, 02 Sep 2026 13:00:00 +0000</pubDate> <category><![CDATA[Company]]></category> <category><![CDATA[AI/ML]]></category> <guid isPermaLink=\"false\">https://www.docker.com/?p=93294</guid> <description><![CDATA[We believe the future is a multi-model, multi-harness world. And we think it needs a new trust model. In 1988, Norm Hardy described a problem that had been quietly breaking systems for years: the confused deputy. A program that takes action using its permissions instead of yours. Today, every AI agent is that deputy. It...]]></description> <content:encoded><![CDATA[ <p class=\"wp-block-paragraph\"><em>We believe the future is a multi-model, multi-harness world. And we think it needs a new trust model.</em></p> <p class=\"wp-block-paragraph\">In 1988, Norm Hardy described a <a href=\"https://css.csail.mit.edu/6.858/2015/readings/confused-deputy.html\" id=\"dkr_problem-93294\" rel=\"nofollow noopener\" target=\"_blank\">problem</a> that had been quietly breaking systems for years: the confused deputy. A program that takes action using its permissions instead of yours.</p> <p class=\"wp-block-paragraph\">Today, every AI agent is that deputy. It inherits your authority: Your credentials, your repo access, your ability to call APIs. But its behavior is probabilistic. It might be acting on an instruction found in its environment, on a step it invented, or on a confident wrong answer. </p> <p class=\"wp-block-paragraph\">The industry didn’t fix the confused deputy problem by making the deputy itself more careful. They fixed it by moving its authority a layer away. Forty years on, that&#8217;s still the answer.</p> <h2 class=\"wp-block-ponyo-heading text-lg\"> Everyone is converging on the same future </h2> <p class=\"wp-block-paragraph\"></p> <p class=\"wp-block-paragraph\">Three facts are pushing the industry toward the same conclusion.</p> <ol class=\"wp-block-list\"> <li><strong>Agents are expensive loops.</strong> An agent takes many steps, and you pay for every token of every one. We all can agree that it makes no economic sense to call the latest frontier model for simple tasks. </li> <li><strong>The leader of frontier capability changes often.</strong> We’re all aware that the top model of the day (and its vendor) changes every couple of months.</li> <li><strong>Your workflows may need custom models.</strong> Many teams are recognizing that intelligence is commodifying and the differentiator is custom models, derived from custom context.</li> </ol> <p class=\"wp-block-paragraph\">As a result, all of us are quickly ending up with a portfolio of multiple models across multiple harnesses. </p> <p class=\"wp-block-paragraph\">A similar convergence is happening one layer up. Developers pick certain tools for the right task, the way they always have. For example, perhaps Claude Code for long refactors, Codex for daily work, Hermes for quick scripts. </p> <p class=\"wp-block-paragraph\">It’s reasonable to expect the future of work to be multi-model and multi-harness.</p> <h2 class=\"wp-block-ponyo-heading text-lg\"> Which makes trust the defining question </h2> <p class=\"wp-block-paragraph\"></p> <p class=\"wp-block-paragraph\">A lot of agents work the same way. </p> <p class=\"wp-block-paragraph\">They read material that is often out of our control: support tickets, web pages, documentation, and code written by strangers. But they act with authority you granted: your credentials, repo access, production APIs, and the open internet. And they usually do both from a developer&#8217;s laptop, outside typical security guardrails like VPCs and IAM.</p> <p class=\"wp-block-paragraph\">Private data and the ability to act autonomously, together, is what makes an agent worth deploying. Your deputy needs the ability to execute in order to be useful. Which means the interesting question is no longer which model is best. It’s what happens when one of these deputies is wrong, or manipulated.</p> <h2 class=\"wp-block-ponyo-heading text-lg\"> Per-harness guardrails break down </h2> <p class=\"wp-block-paragraph\"></p> <p class=\"wp-block-paragraph\">The obvious answer is that each harness ships its own guardrails. Many do. But relied on as your security boundary, they fail in three ways.</p> <ol class=\"wp-block-list\"> <li><strong>The agent talks past them.</strong> Guardrails inside the harness are enforced in the same loop the agent is running. Deny it a git push and it reaches for the API. Deny the API and it opens a gist. Deny the gist and it tucks the data into a channel you trust and never inspect. Researchers showed last year that a single <a href=\"https://www.docker.com/blog/mcp-horror-stories-github-prompt-injection/\" id=\"dkr_malicious-issue-filed-in-a-public-github-repo-93294\">malicious issue filed in a public GitHub repo</a> could steer a coding agent into reading a company&#8217;s private repositories and publishing the contents in a pull request the agent opened itself. Nothing was hacked since every step used the agent&#8217;s own legitimate access, through a channel everyone trusts. A boundary the agent can negotiate with is not a boundary.<br></li> <li><strong>The rails move without you.</strong> Most harness&#8217;s isolation models are closed source and ship on their vendor&#8217;s schedule. The major coding agents have each revised their default sandbox and approval behavior several times in the past year alone. Updates to sandboxing models should be treated as a security event. Multiply this by ten harnesses and your security posture is, at any moment, whatever is the patchwork of your half dozen vendors’ measures.<br></li> <li><strong>The rails don&#8217;t cover the fleet.</strong> The custom agent your platform team built has exactly the guardrails your platform team wrote. The agent inside your support SaaS has whatever its vendor chose, and most expose no isolation controls to you at all. Every new harness means building or auditing governance again, from scratch, differently. You end up with a dozen implementations that drift apart, each blind to the others&#8217; traffic, with no single place to set a rule and no single record to understand why something went wrong.</li> </ol> <p class=\"wp-block-paragraph\">Safety cannot depend on the agent making the right decision, or on someone else&#8217;s release schedule.</p> <h2 class=\"wp-block-ponyo-heading text-lg\"> A layer below </h2> <p class=\"wp-block-paragraph\"></p> <p class=\"wp-block-paragraph\">So here is what we believe. The future is multi-model and multi-agent. And given that future, we believe every organization will need a layer below: a runtime layer, <em>below the harness</em>, that all of them run on top of.</p> <p class=\"wp-block-paragraph\">The reasoning is straightforward. Strip away the model, the vendor, and the framework, and an agent has two ways to affect anything. It runs code, which touches files and opens network connections. Or it calls a tool, which acts on a system. Everything an agent does travels one of those paths. And both paths cross the same surface: the runtime, where processes execute, credentials get used, and requests leave the machine. Every agent passes through it, no matter which model powers it, which vendor shipped it, or whether you built it yourself. That makes it the one place where rules you define can be enforced across all your agents. It is also the same fix as 1988, applied to today&#8217;s deputy: the authority sits a layer away.</p> <p class=\"wp-block-paragraph\">Put enforcement there and each of the three failure scenarios we spoke about flips around.</p> <p class=\"wp-block-paragraph\"><strong>Your agents can&#8217;t talk past themselves.</strong> The boundary for an agent sits outside the loop the agent is running, so it holds steady no matter if the model is with you, hallucinating, or compromised. A hard neutral boundary at the runtime is more effective than a prompt-level boundary the agent creates for itself.</p> <p class=\"wp-block-paragraph\"><strong>The rails stop moving randomly.</strong> Policy is yours, written once, covering execution, tool calls, credentials, and spend. Now, a model or agent vendor making an update won’t randomly change your security posture.</p> <p class=\"wp-block-paragraph\"><strong>The rails cover your whole fleet.</strong> A policy you write up will apply to every harness. And every action, by all your agents, lands in one record: what ran, what it touched, which rule decided. </p> <p class=\"wp-block-paragraph\">This is what lets you be nuanced about agents. Without a boundary below your harnesses, you have three bad options: block agents completely, allow all of them and hope for the best, or wedge a manual approval into every step and give up the productivity you wanted.</p> <p class=\"wp-block-paragraph\">A boundary at the runtime gives you a fourth option. When consequences are bounded even if an agent goes off the rails, you can start granting it true autonomy, which is the goal.</p> <p class=\"wp-block-paragraph\">We expect models to keep changing and new harnesses to land in all of our toolkits. That part is healthy. The boundary underneath them is the part that should hold steady.</p> <p class=\"wp-block-paragraph\"><em>At We Are Developers in San Jose, Tushar Jain, Docker&#8217;s CTO, will talk more about this world: multiple models, multiple harnesses, and a single runtime under it all.</em></p> ]]></content:encoded> </item> <item> <title>Secure by default is your only way forward</title> <link>https://www.docker.com/blog/secure-by-default-is-your-only-way-forward/</link> <dc:creator><![CDATA[Vishrut Iyengar]]></dc:creator> <pubDate>Mon, 31 Aug 2026 13:00:00 +0000</pubDate> <category><![CDATA[Community]]></category> <category><![CDATA[Enterprise]]></category> <category><![CDATA[Products]]></category> <category><![CDATA[Security]]></category> <category><![CDATA[Solutions]]></category> <category><![CDATA[security]]></category> <guid isPermaLink=\"false\">https://www.docker.com/?p=93270</guid> <description><![CDATA[The newest worker on your team builds with whatever it finds and never asks what deserves your trust. Our answer is a hardened foundation and a boundary built for agents.]]></description> <content:encoded><![CDATA[ <p class=\"wp-block-paragraph\">Every worker a company employs, be it a person or a program, builds on a foundation someone else assembled, and that includes the newest hire on your team. This new hire got to work the moment they arrived, building with what your company already has in place and they’re shipping code at a pace your reviews can’t keep up with. Also, everything they make is going out under your name. If it were a human, they’d spend the first week asking where things live and who maintains what. This one never asks. It treats everything it finds as trustworthy, so everything it builds carries that unexamined trust forward. And because this new hire is an agent that&#8217;s working all night at machine-class throughput, the foundational problems that used to surface slowly now surface all at once.</p> <h2 class=\"wp-block-ponyo-heading text-lg\"> <strong>The foundation that nobody audited</strong> </h2> <p class=\"wp-block-paragraph\"></p> <p class=\"wp-block-paragraph\">The line between a supply chain attack and an AI attack no longer exists. Take a look at what the average foundation holds, because most of it comes from outside the company. For a long time now, public base images have carried hundreds of packages that your application never uses. Every one of those packages adds to the attack surface. Almost none of them ever get reviewed because no team has time to read code it didn’t choose and doesn’t use. In most stacks, something like a ten-year-old Java service is keeping the business running on software whose maintainers stopped patching years ago. Platform teams have been coping in their own ways, usually with a golden-image program somebody built years ago and a scanner pointed at it all. Because the images underneath are so bloated, that scanner cries wolf about four hundred times a week. All of this together is why audit season now eats up most of a quarter.</p> <p class=\"wp-block-paragraph\">Attackers know all of this, and they’ve been working on the foundation layer all year. They’ve poisoned packages and developer tools, and they’ve had real success harvesting coding-assistant credentials at scale. Most foundations were built for a world that no longer exists.</p> <h2 class=\"wp-block-ponyo-heading text-lg\"> What a good foundation takes </h2> <p class=\"wp-block-paragraph\"></p> <p class=\"wp-block-paragraph\">The good news is that none of this is unsolvable. A foundation can be strengthened to carry what’s now being built on top of it. It has to meet a few requirements, and each one depends on who does the security work, because when the vendor doesn’t, your team picks up the slack. A foundation holds when every part of it is built from source by someone who signs the work and stands behind it. Nothing should ship that your application doesn’t need, because anything extra adds surface area to defend later. Patching needs the same treatment because new vulnerabilities keep landing no matter how clean an image starts. A fix should come with contractual backing and a date. You should know exactly what’s inside every image the day it ships. And none of this should force you to move your stack onto a different distribution just to get safer images. A migration like that becomes a quarter-long project in its own right, and the foundation can’t protect anything until the move is complete.</p> <p class=\"wp-block-paragraph\">This is exactly what <a href=\"https://www.docker.com/products/hardened-images/\" id=\"dkr_docker-hardened-images-93270\">Docker Hardened Images</a> were built for. They stay compatible with the Alpine and Debian images teams already run, so adoption amounts to a one-line change to the FROM line in your Dockerfile, with no migration project attached. The images are also minimal by design, carrying only what your application needs, which reduces the attack surface by up to 95% and leaves near-zero critical and high CVEs from day one. The difference is immediately visible in scanning. Scans complete much faster with low noise, and the few findings that do remain are worth directing the team’s attention to. When a CVE does get disclosed, the remediated image is available within seven days of the upstream fix, and what once consumed a sprint of engineering time closes as a pull request. The same evidence carries through to audits, which most organizations will eventually face. Every hardened image ships with a signed SBOM (Software Bill of Materials) and build provenance, a verifiable record of the image’s contents and build process. You present auditors with proof that already exists, and no one needs to spend weeks reconstructing it.</p> <p class=\"wp-block-paragraph\">Furthermore, a hardened base image by itself may not be enough, because minimal images almost always need customization before they fit production workflows. Teams add their own CA certificates and init scripts, install additional system packages through apt and apk, or adopt separate products entirely to cover what the base image cannot, fragmenting their foundation across vendors. That’s usually where a hardened foundation breaks down, because customizing an image invalidates the provenance and the SBOM, and with them the assurances you paid for. Not with Docker.</p> <p class=\"wp-block-paragraph\">Hardened system packages give everything you add the same built-from-source treatment, ensure your customizations run through the same hardened pipeline, and keep the guarantees intact, with the SLA still behind them. With Docker, the entire foundation stays within a single ecosystem.</p> <p class=\"wp-block-paragraph\">One thing stays inevitable no matter how well you do all of this. The software you depend on will eventually go unsupported upstream, and without coverage, the security patches stop, and the compliance answers get harder every quarter. <a href=\"https://www.docker.com/products/hardened-images/\" id=\"dkr_extended-lifecycle-support-93270\">Extended Lifecycle Support</a> closes that gap with commercially backed patches for up to five years past end of life, so the move to whatever comes next happens on your timeline and your terms, instead of upstream’s. That is what a solid foundation looks like, and it has never mattered more, because your newest employee, the agent, is stress-testing what everyone before it built.</p> <h1 class=\"wp-block-ponyo-heading text-lg\"> The new layer </h1> <p class=\"wp-block-paragraph\"></p> <p class=\"wp-block-paragraph\">Agents build on this foundation the same way every human before them has, and the trust it carries passes into what they build. But there’s a new reality now. Agents have created a new layer on top, and it matters almost as much as the foundation itself. They pull packages from the foundation and wire tools together, running what they build as soon as it exists. They’re also non-deterministic and ephemeral. The same task can go differently every run, and the agent session that did the work no longer exists by the time anyone comes back with questions.</p> <p class=\"wp-block-paragraph\">Every control in the standard stack was built for a human worker, one with a permanent identity and a predictable pace, whose work can be reviewed before it ships. Agents have none of those traits. The market’s first response was to ask for human permission before every agent action, and when the prompts got too cumbersome, teams moved to isolating agents. That created its own gap because the endpoint tools meant to watch the work sit on the host, and the more you isolate the agent, the less those tools see. There has never been a control surface built for a workflow like this, and retrofitting the old parts leaves teams stuck between prompt fatigue and blind spots.</p> <p class=\"wp-block-paragraph\">So Docker built the missing layer, one that adds to your defense in depth without replacing anything you already run. At Docker, every agent session runs in its own disposable, MicroVM-based <a href=\"https://www.docker.com/products/docker-sandboxes/\" id=\"dkr_docker-sandbox-93270\">Docker Sandbox</a>. The sandbox walls the agent off from the host at the operating-system level. Credentials get proxied in for the task at hand and never stored inside, and you decide what gets piped in and out of the box. Our own security team has blocked coding agents on the host outright and runs them in sandboxes with full autonomy, several at a time. An infostealer that lands in one of those boxes finds nothing to grab. Call it YOLO mode with guardrails.</p> <p class=\"wp-block-paragraph\">The tools agents reach for are the next layer, built on the same foundation. Agents interact with the outside world through MCP (Model Context Protocol) servers, connectors that let them call external tools and access data. An agent grabbing connectors off the open internet is the package problem all over again. So Docker ships hardened MCP servers through the same catalog as the hardened images, built and signed the same way. The <a href=\"https://www.docker.com/products/mcp-catalog-and-toolkit/\" id=\"dkr_mcp-catalog-and-toolkit-93270\">MCP Catalog and Toolkit</a> give your teams one trusted place to find and run them. Every tool call routes through the MCP Gateway, where it is authenticated, authorized, and logged before reaching the external system. That turns enforcement from advisory to strict. </p> <p class=\"wp-block-paragraph\"><a href=\"https://www.docker.com/products/docker-scout/\" id=\"dkr_docker-scout-93270\">Docker Scout</a> enforces the policy at build time, so the secure path remains the default without anyone having to police it by hand. And where the box sits stops mattering, whether it&#8217;s a laptop or the cloud, because the boundary travels with the work, as Docker containers always have.</p> <h2 class=\"wp-block-ponyo-heading text-lg\"> The winning playbook already exists </h2> <p class=\"wp-block-paragraph\"></p> <p class=\"wp-block-paragraph\">Docker wrote this playbook the first time. In the 2010s, software pulled in parts its builders didn’t control, and shipping outpaced review. Slowing down was never on the table, so Docker packaged the application and its dependencies into one portable, isolated unit, and speed and safety started pulling in the same direction. That bet is a large part of how the modern software supply chain took shape, and now we’re making it again for agents. One foundation and one boundary serve people and agents on the same supply chain, under the same policy. Security gets quieter, and development gets faster. There’s no separate AI security program to buy. Docker has been making the case that <a href=\"https://www.docker.com/blog/security-is-a-developer-experience-problem-rooted-in-our-foundations/\" id=\"dkr_security-is-a-developer-experience-problem-93270\">security is a developer experience problem</a> from the start.</p> <h1 class=\"wp-block-ponyo-heading text-lg\"> See it live in San Jose </h1> <p class=\"wp-block-paragraph\"></p> <p class=\"wp-block-paragraph\">We’re bringing all of it to <a href=\"https://www.wearedevelopers.com/world-congress-north-america\" id=\"dkr_wearedevelopers-world-congress-93270\" rel=\"nofollow noopener\" target=\"_blank\">WeAreDevelopers World Congress</a> in San Jose, September 23 to 25. Docker’s CISO Mark Lechner will take the stage with <strong>One boundary for the agentic era</strong>, the boundary his own team lives inside, and the Docker Zone will run live demos all three days.</p> <h3 class=\"wp-block-ponyo-heading text-lg\"> The newest hire starts Monday either way. What will you have ready for them to build on? </h3> <p class=\"wp-block-paragraph\"></p> ]]></content:encoded> </item> <item> <title>Moving from Minimus to Docker Hardened Images</title> <link>https://www.docker.com/blog/moving-from-minimus-to-docker-hardened-images/</link> <dc:creator><![CDATA[Vishrut Iyengar]]></dc:creator> <pubDate>Tue, 25 Aug 2026 22:27:06 +0000</pubDate> <category><![CDATA[Community]]></category> <category><![CDATA[Enterprise]]></category> <category><![CDATA[Products]]></category> <category><![CDATA[Security]]></category> <category><![CDATA[Solutions]]></category> <category><![CDATA[Docker Hardened Images]]></category> <guid isPermaLink=\"false\">https://www.docker.com/?p=93146</guid> <description><![CDATA[The Minimus registry goes offline on October 22. Here is the migration path, the free help Docker is offering, and where to start.]]></description> <content:encoded><![CDATA[ <p class=\"wp-block-paragraph\">The hardened-images space gets better when more people are working on the problem, and Minimus has been a valuable part of that work. That changed this week, when they announced they are ending operations. Though we were competitors, we both believed strongly in the importance of reducing vulnerabilities at the foundation of the software supply chain. Their efforts to bring needed awareness to this challenge will be missed, and our thoughts go out to Minimus employees who are impacted by this decision.</p> <p class=\"wp-block-paragraph\">While the human side of this story deserves the most attention, there’s also a practical side: if you’re a customer running Minimus images in production, you’re now facing a migration you didn’t plan for. <a href=\"https://www.minimus.io/\" id=\"dkr_their-notice-93146\" rel=\"nofollow noopener\" target=\"_blank\">Their notice</a> commits to a 60-day maintenance window, with images receiving upstream updates until the registry goes offline on October 22, 2026. Images already pulled will keep running after that date, but no further updates will ship to them, and any new CVE stays unpatched from that point on.</p> <p class=\"wp-block-paragraph\">If you need a hand, Docker is offering free migration assistance to Minimus customers. Write to <a href=\"mailto:minimus@docker.com\" id=\"dkr_minimusdockercom-93146\">minimus@docker.com</a> to walk through your specific image list, your compliance requirements, or questions around your migration plans, and a technical migration expert will get back to you. You don&#8217;t need a sales call to start migrating to DHI today.</p> <p class=\"wp-block-paragraph\">Docker’s free, open source catalog is available to everyone under Apache 2.0, allows production use, and has no user caps. The migration is about as easy as these things get, a drop-in with minimal workflow changes. It’s more of a swap than a rebuild. It&#8217;s easy to find your images&#8217; equivalents in the DHI catalog, and for most of your services, the whole change is updating the FROM line. Use the <a href=\"https://docs.docker.com/dhi/migration/\" id=\"dkr_migration-guide-93146\" rel=\"nofollow noopener\" target=\"_blank\">migration guide</a> for the step-by-step process and the <a href=\"https://docs.docker.com/dhi/migration/checklist/\" id=\"dkr_checklist-93146\" rel=\"nofollow noopener\" target=\"_blank\">checklist</a> to track each image through the swap and verification. The <a href=\"https://docs.docker.com/dhi/migration/examples/\" id=\"dkr_worked-examples-93146\" rel=\"nofollow noopener\" target=\"_blank\">worked examples</a> show full migrations end to end, and <a href=\"https://docs.docker.com/dhi/migration/migrate-with-ai/\" id=\"dkr_gordon-93146\" rel=\"nofollow noopener\" target=\"_blank\">Gordon</a>, Docker&#8217;s AI assistant, runs the first pass with you.</p> <p class=\"wp-block-paragraph\">Whether you decide to migrate to Docker or somewhere else, we recommend you start that process now, while the maintenance window keeps your current images patched. You can browse the full DHI catalog on <a href=\"https://hub.docker.com/\" id=\"dkr_docker-hub-93146\" rel=\"nofollow noopener\" target=\"_blank\">Docker Hub</a>, make the first swap, and, of course, reach out to us if you need help.</p> <h2 class=\"wp-block-heading\">Docker Hardened Images</h2> <p class=\"wp-block-paragraph\"><a href=\"https://www.docker.com/products/hardened-images/\" id=\"dkr_docker-hardened-images-93146\">Docker Hardened Images</a> are minimal, hardened images built from source and continuously maintained by Docker. The catalog covers 4,000+ images, compatible with Alpine and Debian, so your Dockerfiles and CI keep working as they are. Every image ships near-zero CVEs with full, unsuppressed CVE visibility, and each carries a complete SBOM, SLSA Build Level 3 provenance, and cryptographic signatures. Docker manages the full lifecycle of your image, and teams moving from standard public images see up to 95% CVE reduction and up to 90% attack-surface reduction. Paid tiers add SLA-backed remediation, FIPS and STIG variants, customizations, and up to five years of coverage for versions past end of life.</p> <p class=\"wp-block-paragraph\"></p> ]]></content:encoded> </item> <item> <title>MinIO End of Life: How to Stay Patched and Audit-Ready with Docker ELS</title> <link>https://www.docker.com/blog/minio-end-of-life-how-to-stay-patched-and-audit-ready-with-docker-els/</link> <dc:creator><![CDATA[Vishrut Iyengar]]></dc:creator> <pubDate>Mon, 24 Aug 2026 13:00:00 +0000</pubDate> <category><![CDATA[Community]]></category> <category><![CDATA[Enterprise]]></category> <category><![CDATA[Products]]></category> <category><![CDATA[Security]]></category> <category><![CDATA[Solutions]]></category> <guid isPermaLink=\"false\">https://www.docker.com/?p=93028</guid> <description><![CDATA[MinIO reached end of life in February 2026. Docker Extended Lifecycle Support (ELS) keeps end-of-life software like it patched, compliant, and audit-ready for up to five years, covering versions upstream no longer supports all the way up to entire projects.]]></description> <content:encoded><![CDATA[ <p class=\"wp-block-paragraph\"><em>MinIO reached end of life in February 2026. Docker Extended Lifecycle Support (ELS) keeps end-of-life software like it patched, compliant, and audit-ready for up to five years, covering versions upstream no longer supports all the way up to entire projects.</em></p> <p class=\"wp-block-paragraph\">On February 13, 2026, the MinIO open-source project was archived upstream. A project with <a href=\"https://www.min.io/press/minio-surpasses-one-billion-cumulative-docker-downloads-as-business-surges\" id=\"dkr_more-than-a-billion-docker-pulls-93028\" rel=\"nofollow noopener\" target=\"_blank\">more than a billion Docker pulls</a> stopped shipping releases, bug fixes, and security patches overnight. From that day forward, every environment running MinIO is exposed. New CVEs in MinIO and its Go dependency tree now arrive with no upstream patch behind them, and an audit reads that as unsupported software in production.</p> <p class=\"wp-block-paragraph\">And MinIO is only the newest instance of a wider problem. Black Duck&#8217;s <a href=\"https://www.blackduck.com/blog/open-source-trends-ossra-report.html\" id=\"dkr_2026-open-source-security-and-risk-analysis-report-93028\" rel=\"nofollow noopener\" target=\"_blank\">2026 Open Source Security and Risk Analysis report</a> found that 93% of commercial codebases carry components with no development activity in at least two years. The same pattern runs across the stack. Node 18, Python 3.8, and older Airflow releases still run in production long after upstream support ended, and frameworks like FedRAMP, DORA, and the Cyber Resilience Act treat unpatched end-of-life software as an audit finding. The migration deadline ends up set by the audit calendar instead of the roadmap.</p> <p class=\"wp-block-paragraph\"><a href=\"https://www.docker.com/products/hardened-images/\" id=\"dkr_docker-hardened-images-93028\">Docker Hardened Images</a> Extended Lifecycle Support exists to hand that schedule back to you. The model is simple. Request an ELS image, and Docker builds and maintains it for up to five years past upstream end of life. The maintained MinIO image is the newest proof of that model.</p> <h2 class=\"wp-block-ponyo-heading text-lg\"> <strong>MinIO lives on as the newest ELS update</strong><br><br> </h2> <p class=\"wp-block-paragraph\">The archive lands on the storage layer, where migrations are measured in petabytes. Moving a production object store to a different system is slow, expensive work, and the CVE exposure keeps growing while that work runs.</p> <p class=\"wp-block-paragraph\">Teams running MinIO have three options</p> <ol class=\"wp-block-list\"> <li>Move to a commercial replacement and take on new licensing and lock-in.</li> <li>Carry the patches yourself, which means staffing sustained Go security engineering for a project that no longer ships fixes.</li> <li>Keep what you run and put a vendor on the hook for it. </li> </ol> <p class=\"wp-block-paragraph\">Doing nothing is not a fourth option. </p> <p class=\"wp-block-paragraph\">Docker identified the archive as a live exposure across its customers&#8217; software supply chains and built the answer into the catalog, where MinIO lives on as a maintained, hardened image. Docker tracks new CVEs across MinIO and its full Go dependency graph, transitive dependencies included at no extra cost, then backports the fixes, rebuilds, and ships. Your object store stays supported and your audits stay clean.</p> <h2 class=\"wp-block-ponyo-heading text-lg\"> Extended Lifecycle Support for your whole fleet </h2> <p class=\"wp-block-paragraph\"></p> <p class=\"wp-block-paragraph\">What ELS does for MinIO, it does for any end-of-life component you need to keep. An EOL finding forces a choice between two bad projects. Rush the migration and risk breaking production, or file the exception and watch the list grow every quarter. ELS removes that deadline. Patches and audit evidence keep flowing on the images already in production while the migration happens on the roadmap&#8217;s schedule.</p> <p class=\"wp-block-paragraph\">The entitlement is built for how end of life actually arrives, on staggered dates across a fleet. Applied to a repository, it covers every available ELS version there. When one migration completes, you re-point it at the next repository, and the coverage moves with the risk.</p> <p class=\"wp-block-paragraph\">Coverage is not limited to a fixed list either. Docker watches the end-of-life calendar and builds ahead of it, and anything you don&#8217;t see in the catalog, you can request. The span runs from end-of-life versions of supported software all the way up to entire archived projects. Nginx, Node, and Python ELS images are already there.</p> <p class=\"wp-block-paragraph\">ELS is a paid add-on to a Docker Hardened Images subscription, and it runs on the same rails as the rest of DHI:</p> <ul class=\"wp-block-list\"> <li><strong>Name it, get it. </strong>Tell Docker the end-of-life line your production depends on. Docker builds it hardened and maintains it at the line&#8217;s newest patch version.</li> <li><strong>Adopt without a migration. </strong>ELS-tagged images appear in the standard DHI catalog alongside LTS tags. Same registry, same workflow, a FROM-line change.</li> <li><strong>Stay patched for years. </strong>Critical and high-severity CVEs are patched on a 14-day SLA, for up to five years past end of life.</li> <li><strong>Evidence included. </strong>Every ELS image holds the same standard as the rest of the catalog. Built from source and signed, with SBOMs, VEX statements, and SLSA Build Level 3 provenance maintained for the life of the image.</li> </ul> <p class=\"wp-block-paragraph\">Those attestations are the difference between extended support and an extended liability. A legacy app with a giant SBOM and no exploitability data just lights up your scanners. ELS ships the evidence with the image, so auditors see signed proof of what&#8217;s patched and what&#8217;s not exploitable.</p> <p class=\"wp-block-paragraph\">If there&#8217;s a version in your fleet you can&#8217;t migrate off and can&#8217;t leave unpatched, that&#8217;s an ELS conversation. Browse the <a href=\"https://hub.docker.com/hardened-images/catalog\" id=\"dkr_dhi-catalog-93028\" rel=\"nofollow noopener\" target=\"_blank\">DHI catalog</a> to see what&#8217;s already covered, and talk to us about the versions you need to keep alive. </p> <p class=\"wp-block-paragraph\"></p> ]]></content:encoded> </item> <item> <title>Running AI agents in GitHub Actions with Docker Sandboxes</title> <link>https://www.docker.com/blog/running-ai-agents-in-github-actions-with-docker-sandboxes/</link> <dc:creator><![CDATA[Jennifer Kohl]]></dc:creator> <pubDate>Fri, 21 Aug 2026 13:00:00 +0000</pubDate> <category><![CDATA[Engineering]]></category> <category><![CDATA[AI Agent]]></category> <category><![CDATA[Docker Sandboxes]]></category> <guid isPermaLink=\"false\">https://www.docker.com/?p=92832</guid> <description><![CDATA[Run AI agents in GitHub Actions with Docker Sandboxes. See how isolated agents can run Testcontainers tests, fix code, and open draft pull requests.]]></description> <content:encoded><![CDATA[ <p class=\"wp-block-paragraph\">In July 2026, <a href=\"https://github.com/github/gh-aw\" id=\"dkr_github-agentic-workflows-92832\" rel=\"nofollow noopener\" target=\"_blank\">GitHub Agentic Workflows</a> added <a href=\"https://github.github.com/gh-aw/reference/agent-runtimes/#docker-sbx\" id=\"dkr_docker-sandboxes-as-a-supported-agent-runtime-92832\" rel=\"nofollow noopener\" target=\"_blank\">Docker Sandboxes as a supported agent runtime</a>. It means that in your CI an AI coding agent can have broad control of its environment, including being able to run Docker containers, while the environment itself is isolated in a microVM with a network policy and secrets injection like the current best practices for AI isolation advice. </p> <p class=\"wp-block-paragraph\">Agentic isolation matters because useful coding agents do more than read a repository and suggest a patch. They install tools, run arbitrary shell commands, execute project code, start databases, and occasionally discover surprising new meanings for the word &#8220;cleanup.&#8221; Those capabilities make the agent useful, and direct access to a CI runner gives every mistake a larger blast radius.</p> <p class=\"wp-block-paragraph\">Now, with sbx integrated, the boundary for the Agent is a disposable environment with substantial freedom inside and narrow access to everything outside it.</p> <p class=\"wp-block-paragraph\">I put together a <a href=\"https://github.com/shelajev/docker-sandbox-gh-aw-demo\" id=\"dkr_small-example-92832\" rel=\"nofollow noopener\" target=\"_blank\">small example</a> to see what that looks like in practice. The agent runs on a GitHub-hosted Ubuntu runner, enters a Docker Sandbox (sbx), runs a Java integration test suite with PostgreSQL using Testcontainers, finds an intentionally seeded bug, fixes it, and opens a draft pull request. The Github Agentic Workflows offers the integration out-of-the-box, so the setup requires zero custom configuration for actions.</p> <h2 class=\"wp-block-heading\">What are GitHub Agentic Workflows?</h2> <p class=\"wp-block-paragraph\"><a href=\"https://docs.github.com/actions\" id=\"dkr_github-actions-92832\" rel=\"nofollow noopener\" target=\"_blank\">GitHub Actions</a> remains the CI system. It schedules the job, provides the Ubuntu runner, manages permissions and secrets, and records the result.</p> <p class=\"wp-block-paragraph\">GitHub Agentic Workflows, usually shortened to <code>gh-aw</code>, is an open-source GitHub CLI extension and compiler. You describe an agentic workflow in a Markdown file that combines execution configuration in YAML frontmatter with the agent&#8217;s task in the body. Running <code>gh aw compile</code> turns that source into a conventional GitHub Actions workflow with a <code>.lock.yml</code> suffix.</p> <p class=\"wp-block-paragraph\">The relationship looks like this:</p> <div class=\"wp-block-syntaxhighlighter-code \"><pre class=\"brush: plain; gutter: false; title: ; notranslate\"> Markdown workflow | | gh aw compile v Generated GitHub Actions .lock.yml | | runs on ubuntu-24.04 v Docker Sandbox microVM | v Copilot agent and its tools </pre></div> <p class=\"wp-block-paragraph\"><code>docker-sbx</code> belongs to <code>gh-aw</code>&#8216;s agent runtime configuration. The <code>runs-on</code> field still selects <code>ubuntu-24.04</code>, and the compiled file is a standard GitHub Actions workflow. It installs the sandbox tooling, authenticates it, checks the runner, starts the agent in the sandbox, and cleans everything up afterward.</p> <p class=\"wp-block-paragraph\">That integration <a href=\"https://github.com/github/gh-aw/pull/45006\" id=\"dkr_landed-in-gh-aw-92832\" rel=\"nofollow noopener\" target=\"_blank\">landed in gh-aw</a> and shipped in version 0.82.9.</p> <h2 class=\"wp-block-heading\">Configuring sbx in GitHub Actions</h2> <p class=\"wp-block-paragraph\">Here is the configuration from the sample&#8217;s <a href=\"https://github.com/shelajev/docker-sandbox-gh-aw-demo/blob/main/.github/workflows/sandbox-explorer.md\" id=\"dkr_sandbox-explorermd-92832\" rel=\"nofollow noopener\" target=\"_blank\">sandbox-explorer.md</a>:</p> <div class=\"wp-block-syntaxhighlighter-code \"><pre class=\"brush: plain; gutter: false; title: ; notranslate\"> --- name: &quot;Docker Sandboxes sample: exploratory test&quot; on: workflow_dispatch: runs-on: ubuntu-24.04 permissions: contents: read copilot-requests: write engine: copilot network: allowed: - defaults - github - containers - java sandbox: agent: id: awf runtime: docker-sbx sudo: true tools: edit: bash: &#x5B;&quot;:*&quot;] safe-outputs: create-pull-request: title-prefix: &quot;&#x5B;docker-sbx sample] &quot; draft: true protected-files: blocked allowed-files: - &quot;src/**&quot; --- </pre></div> <p class=\"wp-block-paragraph\">The three lines under <code>sandbox.agent</code> select the Docker Sandbox runtime. Inside it, the agent has the <code>sudo</code> and unrestricted shell access needed to build the application and start its test infrastructure.</p> <p class=\"wp-block-paragraph\">Outside the sandbox, the workflow keeps a much smaller surface. Its <code>network</code> block allowlists the destinations this job needs, while the agent&#8217;s GitHub token can read repository contents and send requests to Copilot. Pull request creation happens in a separate safe-output job whose patch may contain files only under <code>src/**</code>.</p> <p class=\"wp-block-paragraph\">How much autonomy a CI agent should receive depends on the job. For this one, the split is useful: broad shell access inside the sandbox, small network and repository surfaces outside it, and a draft PR that still expects human review.</p> <h2 class=\"wp-block-heading\">The isolation boundary is a micro VM</h2> <p class=\"wp-block-paragraph\">While it&#8217;s common to assume that &#8220;Docker&#8221; implies a single application container, this setup actually uses a microVM as the primary isolation boundary.</p> <p class=\"wp-block-paragraph\">With <a href=\"https://docs.docker.com/ai/sandboxes/architecture/\" id=\"dkr_sbx-92832\" rel=\"nofollow noopener\" target=\"_blank\">sbx</a>, every sandbox is a dedicated environment with its own kernel, filesystem, and network stack. Most importantly, it runs its own private Docker daemon. This means the agent gets full root privileges inside the VM without ever gaining control over the host&#8217;s Docker daemon. The only bridge between them is the explicit shared workspace of the repository.</p> <p class=\"wp-block-paragraph\">Having a private daemon is a game-changer for integration testing. In this demo, the app runs Testcontainers exactly as a developer would on their local machine. The resulting structure looks like this:</p> <div class=\"wp-block-syntaxhighlighter-code \"><pre class=\"brush: plain; gutter: false; title: ; notranslate\"> GitHub Actions runner └── Docker Sandbox microVM ├── GitHub Agentic Workflows agent └── Private Docker daemon ├── Maven / Java 21 container └── PostgreSQL Testcontainers container </pre></div> <p class=\"wp-block-paragraph\">To keep the environment clean, the test launcher runs Maven inside a pinned container, passing the sandbox&#8217;s Docker socket through so it can talk to the private daemon:</p> <div class=\"wp-block-syntaxhighlighter-code \"><pre class=\"brush: bash; gutter: false; title: ; notranslate\"> docker run --rm \\ --add-host=host.testcontainers.internal:host-gateway \\ -e TESTCONTAINERS_HOST_OVERRIDE=host.testcontainers.internal \\ -v &quot;$PWD:/workspace&quot; \\ -w /workspace \\ -v /var/run/docker.sock:/var/run/docker.sock \\ maven:3.9.9-eclipse-temurin-21@sha256:3a4ab3276a087bf276f79cae96b1af04f53731bec53fb2e651aca79e4b10211e \\ mvn --batch-mode &quot;$@&quot; test </pre></div> <p class=\"wp-block-paragraph\">Testcontainers then uses that socket to spin up the PostgreSQL database. It sounds like a lot of layers—a container running a build that starts another container, all inside a microVM on a CI runner but each layer serves a specific purpose in ensuring the agent remains isolated yet fully capable.</p> <h2 class=\"wp-block-heading\">Giving the agent a defect worth finding</h2> <p class=\"wp-block-paragraph\">The sample is a small Java 21 registration service. Its requirements say that email addresses are case-insensitive. The seeded implementation stores them as provided and relies on PostgreSQL&#8217;s case-sensitive unique constraint. An existing Testcontainers integration test catches exact duplicates but says nothing about the latter case.</p> <p class=\"wp-block-paragraph\">The Markdown portion of the workflow asks the agent to inspect the requirement and code, run the baseline suite, and add a test for two addresses that differ only in case. If the invariant fails, the agent should make the smallest source correction. Before touching the application, it records <code>uname</code>, Docker version, Docker information, and a tiny Alpine container run, leaving specific evidence in the workflow log about where the work executed.</p> <p class=\"wp-block-paragraph\">The task itself is plain Markdown beneath the frontmatter in the yaml file. The important part for us (after some commands for recording the environment for debugging) is:</p> <div class=\"wp-block-syntaxhighlighter-code \"><pre class=\"brush: plain; gutter: false; title: ; notranslate\"> Act as a bounded exploratory tester for this repository. ... Then: 1. Read `REQUIREMENTS.md` and the relevant source and test files. 2. Run `./scripts/test-in-docker.sh` without changing anything. 3. Add a PostgreSQL Testcontainers test that checks registration of two addresses that differ only in letter case. 4. Run the focused test and explain the observed behavior. 5. If the implementation violates the documented invariant, make the smallest fix under `src/`. 6. Run the complete test suite again. 7. Create one draft pull request containing the regression test and fix. </pre></div> <p class=\"wp-block-paragraph\">And the prompt level guardrails to suggest the correct behavior: </p> <div class=\"wp-block-syntaxhighlighter-code \"><pre class=\"brush: plain; gutter: false; title: ; notranslate\"> Do not modify dependency manifests, workflow files, scripts, documentation, or generated files. Do not weaken or delete existing tests. Include the commands run and their results in the pull request description. </pre></div> <p class=\"wp-block-paragraph\">The real run of course followed that path: its baseline passed, then the new case-variation test failed with:</p> <div class=\"wp-block-syntaxhighlighter-code \"><pre class=\"brush: plain; gutter: false; title: ; notranslate\"> expected: &amp;lt;false&amp;gt; but was: &amp;lt;true&amp;gt; </pre></div> <p class=\"wp-block-paragraph\">The agent normalized the email before inserting it, reran the complete suite, and got two passing integration tests.</p> <p class=\"wp-block-paragraph\">The log reported Docker client and server version 29.7.1 with the <code>default</code> context. It is the correct Docker version currently in the sbx default sandbox template. This is the sandbox&#8217;s private daemon, the one Testcontainers library used to launch PostgreSQL for the integration tests. </p> <figure class=\"wp-block-image size-full\"><img decoding=\"async\" width=\"1440\" height=\"670\" src=\"https://www.docker.com/app/uploads/2026/08/image2-1.png\" alt=\"image2 1\" class=\"wp-image-92833\" title=\"- image2 1\" srcset=\"https://www.docker.com/app/uploads/2026/08/image2-1.png 1440w, https://www.docker.com/app/uploads/2026/08/image2-1-600x279.png 600w, https://www.docker.com/app/uploads/2026/08/image2-1-250x116.png 250w, https://www.docker.com/app/uploads/2026/08/image2-1-64x30.png 64w\" sizes=\"(max-width: 1440px) 100vw, 1440px\" /></figure> <p class=\"wp-block-paragraph\"><em>The complete workflow passed on GitHub&#8217;s hosted <code>ubuntu-24.04</code> runner. The </em><a href=\"https://github.com/shelajev/docker-sandbox-gh-aw-demo/actions/runs/31590806747\" id=\"dkr_run-92832\" rel=\"nofollow noopener\" target=\"_blank\"><em>run</em></a><em> took 11 minutes and 16 seconds.</em></p> <p class=\"wp-block-paragraph\">The safe-output job then opened a draft PR containing exactly two files under <code>src/**</code>: the regression test and the one-line normalization fix. Workflow configuration, scripts, dependencies, and documentation were outside its allowed patch surface.</p> <div class=\"wp-block-ponyo-image\"> <img decoding=\"async\" width=\"1440\" height=\"1600\" src=\"https://www.docker.com/app/uploads/2026/08/image1-2.png\" class=\"fade-in\" alt=\"image1 2\" srcset=\"https://www.docker.com/app/uploads/2026/08/image1-2.png 1440w, https://www.docker.com/app/uploads/2026/08/image1-2-1382x1536.png 1382w, https://www.docker.com/app/uploads/2026/08/image1-2-600x667.png 600w, https://www.docker.com/app/uploads/2026/08/image1-2-250x278.png 250w, https://www.docker.com/app/uploads/2026/08/image1-2-64x71.png 64w\" sizes=\"(max-width: 1440px) 100vw, 1440px\" title=\"- image1 2\"> </div> <p class=\"wp-block-paragraph\"><em>The generated </em><a href=\"https://github.com/shelajev/docker-sandbox-gh-aw-demo/pull/1\" id=\"dkr_draft-pull-request-92832\" rel=\"nofollow noopener\" target=\"_blank\"><em>draft pull request</em></a><em> stayed inside the declared source-only boundary.</em></p> <h2 class=\"wp-block-heading\">Running the workflow yourself</h2> <p class=\"wp-block-paragraph\">Start by installing the <code>gh-aw</code>:</p> <div class=\"wp-block-syntaxhighlighter-code \"><pre class=\"brush: bash; gutter: false; title: ; notranslate\"> gh extension install github/gh-aw </pre></div> <p class=\"wp-block-paragraph\">The compiled Docker Sandbox runtime needs Docker credentials to authenticate and pull its sandbox template. Add <code>DOCKER_USERNAME</code> and <code>DOCKER_PAT</code> under the sample repository&#8217;s <strong>Settings &gt; Secrets and variables &gt; Actions</strong>, or let the GitHub CLI prompt for both values:</p> <div class=\"wp-block-syntaxhighlighter-code \"><pre class=\"brush: bash; gutter: false; title: ; notranslate\"> gh secret set DOCKER_USERNAME gh secret set DOCKER_PAT </pre></div> <p class=\"wp-block-paragraph\">The repository&#8217;s Copilot entitlement and <code>copilot-requests: write</code> were sufficient for the successful sample. Repositories without that entitlement can use a supported <code>COPILOT_GITHUB_TOKEN</code> secret as documented by <code>gh-aw</code>.</p> <p class=\"wp-block-paragraph\">Also enable <strong>Allow GitHub Actions to create and approve pull requests</strong> in the repository&#8217;s Actions settings. Then compile the Markdown source and commit both the source and generated workflow:</p> <div class=\"wp-block-syntaxhighlighter-code \"><pre class=\"brush: bash; gutter: false; title: ; notranslate\"> gh aw compile sandbox-explorer git add .github/workflows/sandbox-explorer.md \\ .github/workflows/sandbox-explorer.lock.yml git commit -m &quot;Compile Docker Sandboxes sample workflow&quot; git push </pre></div> <p class=\"wp-block-paragraph\">The <code>.lock.yml</code> is generated code. Changes belong in the Markdown source, followed by another compile.</p> <p class=\"wp-block-paragraph\">Finally, start the workflow and watch it:</p> <div class=\"wp-block-syntaxhighlighter-code \"><pre class=\"brush: bash; gutter: false; title: ; notranslate\"> gh aw run sandbox-explorer gh run watch </pre></div> <p class=\"wp-block-paragraph\">The sample works on GitHub&#8217;s hosted <code>ubuntu-24.04</code> runner as committed. A self-hosted Linux runner needs an appropriate KVM-capable setup, plus the Docker and system access required by Docker Sandboxes.</p> <h2 class=\"wp-block-heading\">Try sbx on your laptop</h2> <p class=\"wp-block-paragraph\">Support for isolating your agents in CI is fantastic, but the easiest way to understand Docker Sandboxes is to put one around an agent on a local project. Follow the <a href=\"https://docs.docker.com/ai/sandboxes/\" id=\"dkr_docker-sandboxes-setup-92832\" rel=\"nofollow noopener\" target=\"_blank\">Docker Sandboxes setup</a> for your platform, sign in, move to a repository, and run an installed agent:</p> <div class=\"wp-block-syntaxhighlighter-code \"><pre class=\"brush: bash; gutter: false; title: ; notranslate\"> sbx login cd ~/my-project sbx run &lt;claude|codex|opencode&gt; </pre></div> <p class=\"wp-block-paragraph\">Give it a task that needs real tools, such as running tests, building an image, or starting a Testcontainers dependency. <code>sbx</code> is much easier to evaluate and understand when the workload is your actual development loop.</p> <p class=\"wp-block-paragraph\">And if your experiment grows into an organization-wide agent rollout, <a href=\"https://www.docker.com/products/ai-governance/\" id=\"dkr_docker-ai-governance-92832\">Docker AI Governance</a> is the next thing to explore. It applies organization and team policies for sandbox network, filesystem, and MCP access, and records policy decisions in audit logs. Those records help to identify the source client, including <code>sbx</code>, and the machine hostname, so the same policy and audit model can easily cover your team&#8217;s laptops and your CI runners.</p> <p class=\"wp-block-paragraph\"></p> ]]></content:encoded> </item> <item> <title>Docker Verified Publisher Applications Are Now Self-Serve</title> <link>https://www.docker.com/blog/docker-verified-publisher-applications-are-now-self-serve/</link> <dc:creator><![CDATA[Dan Berezin Stelzer]]></dc:creator> <pubDate>Thu, 20 Aug 2026 17:00:00 +0000</pubDate> <category><![CDATA[Products]]></category> <category><![CDATA[Docker Hub]]></category> <category><![CDATA[Docker Verified Publisher]]></category> <category><![CDATA[docker verified publisher program]]></category> <guid isPermaLink=\"false\">https://www.docker.com/?p=92968</guid> <description><![CDATA[Apply to become a Docker Verified Publisher (DVP) now directly through Docker Hub. Get your verified content seen first by devs looking for trusted options. ]]></description> <content:encoded><![CDATA[ <h2 class=\"wp-block-ponyo-heading text-lg\"> Curating trusted content for the agentic software era </h2> <p class=\"wp-block-paragraph\">While AI made it easier for organizations to keep up with the latest innovations, it also made it harder to know what to trust. When software is selected at machine speed, the question is no longer &#8220;is this popular?&#8221; It&#8217;s &#8220;do we know who published this?&#8221;</p> <p class=\"wp-block-paragraph\"><a href=\"https://hub.docker.com/explore\" id=\"dkr_docker-hub-92968\" rel=\"nofollow noopener\" target=\"_blank\">Docker Hub</a> has always been where developers go to answer that question. Starting today, software vendors looking to make their trusted content discoverable to developers by becoming Docker Verified Publishers will enjoy a faster application process, with less friction, and plans that fit their specific growth needs.</p> <p class=\"wp-block-paragraph\">With the <a href=\"https://docs.docker.com/docker-hub/repos/manage/trusted-content/dvp-program/\" id=\"dkr_docker-verified-publisher-92968\" rel=\"nofollow noopener\" target=\"_blank\">Docker Verified Publisher</a> (DVP) program, Docker Hub turns into a trusted, discoverable, and measurable distribution channel. Organizations accepted into the program earn verified status and prioritized ranking. DVP publishers also gain access to analytics reports that show which versions are getting the most traction and which companies are pulling them, turning open-source reach into a commercial pipeline.</p> <h2 class=\"wp-block-ponyo-heading text-lg\"> What&#8217;s new in Docker Verified Publisher Applications </h2> <p class=\"wp-block-paragraph\">Applying to become a <a href=\"https://docs.docker.com/docker-hub/repos/manage/trusted-content/dvp-program/\" id=\"dkr_docker-verified-publisher-dvp-92968\" rel=\"nofollow noopener\" target=\"_blank\">Docker Verified Publisher (DVP)</a> is now self-serve. You can now apply directly in Docker Hub, our team reviews your application, and if you&#8217;re approved, you become part of our trusted ecosystem on Docker Hub.</p> <p class=\"wp-block-paragraph\">This marks a significant improvement in how we onboard and evaluate publishers. Previously, companies interested in becoming a Docker Verified Publisher needed to contact our sales team to be considered for the program. While the Docker team still evaluates every single application manually, this change makes it significantly easier to apply to the program.</p> <p class=\"wp-block-paragraph\">Within our new self-serve process, you can choose between <a href=\"https://hub.docker.com/publisher-program#pricing\" id=\"dkr_two-different-plans-that-suit-your-needs-as-you-grow-92968\" rel=\"nofollow noopener\" target=\"_blank\">two different plans that suit your needs as you grow</a>. </p> <h2 class=\"wp-block-ponyo-heading text-lg\"> Turn pulls into reach: One badge for all your content </h2> <p class=\"wp-block-paragraph\">The verified publisher program helps you grow your impact on Docker&#8217;s ecosystem. <a href=\"https://hub.docker.com/search?badges=verified_publisher\" id=\"dkr_with-the-badge-and-priority-search-ranking-due-to-trusted-status-92968\" rel=\"nofollow noopener\" target=\"_blank\">With the badge and priority search ranking due to trusted status</a>, developers evaluating options on Hub see your verified content first.</p> <p class=\"wp-block-paragraph\">DVP analytics also help close the gaps you have in understanding your users and product offerings. <a href=\"https://hub.docker.com/publisher-program#pricing\" id=\"dkr_summary-and-trends-reports-92968\" rel=\"nofollow noopener\" target=\"_blank\">Summary and trends reports</a> show which repositories are gaining ground and where adoption is shifting across versions and releases. Domain-level reports on Growth turn anonymous traffic into named domains, so the teams already running your software show up in your sales and partner pipeline.</p> <p class=\"wp-block-paragraph\">In addition, DVP is designed to mean the same thing across every content type on Hub. Docker Hub isn&#8217;t just images anymore. Developers come to Hub for MCP servers, models, sandboxes, agents, and more; everything that’s needed for an agentic stack. DVP offers one review, one badge, one answer to &#8220;who published this&#8221; no matter what you’re publishing. Whatever you distribute next, your verification comes with you.</p> <h2 class=\"wp-block-ponyo-heading text-lg\"> What DVP means for developers </h2> <p class=\"wp-block-paragraph\">The Verified Publisher badge means Docker has manually reviewed the publisher behind that content and confirmed they are who they claim to be. Publishers such as <a href=\"https://hub.docker.com/u/google\" id=\"dkr_google-92968\" rel=\"nofollow noopener\" target=\"_blank\">Google</a>, <a href=\"https://hub.docker.com/u/microsoft\" id=\"dkr_microsoft-92968\" rel=\"nofollow noopener\" target=\"_blank\">Microsoft</a>, <a href=\"https://hub.docker.com/u/amazon\" id=\"dkr_aws-92968\" rel=\"nofollow noopener\" target=\"_blank\">AWS</a>, <a href=\"https://hub.docker.com/u/datadog\" id=\"dkr_datadog-92968\" rel=\"nofollow noopener\" target=\"_blank\">Datadog</a>, <a href=\"https://hub.docker.com/u/grafana\" id=\"dkr_grafana-labs-92968\" rel=\"nofollow noopener\" target=\"_blank\">Grafana Labs</a>, <a href=\"https://hub.docker.com/u/n8nio\" id=\"dkr_n8n-92968\" rel=\"nofollow noopener\" target=\"_blank\">n8n</a>, and many more rely on DVP to build trust, increase visibility, and grow adoption of their content on Docker Hub.</p> <p class=\"wp-block-paragraph\">Pulling your images from Docker Verified Publishers is a good step towards improving your security posture, but also needs to be paired with other good consumption practices. This means, for example, reviewing the specific artifact you pull, pinning to digests rather than mutable tags, verifying provenance and any signatures at the image level, and checking for CVEs. </p> <p class=\"wp-block-paragraph\">And while publisher verification is an important link in the trust chain, we continue building towards stronger, more secure publishing flows across Docker Hub. Stay tuned for more in this space.</p> <h2 class=\"wp-block-ponyo-heading text-lg\"> Get started </h2> <p class=\"wp-block-paragraph\">You can apply to the Docker Verified Publisher Program from the Explore page in Docker Hub. Verification is done by the Docker team, and you&#8217;ll get a checkout link as soon as you&#8217;re approved.</p> <ul class=\"wp-block-list\"> <li><a href=\"https://hub.docker.com/publisher-program\" id=\"dkr_apply-to-dvp-on-docker-hub-92968\" rel=\"nofollow noopener\" target=\"_blank\">Apply to DVP on Docker Hub</a></li> <li><a href=\"https://docs.docker.com/docker-hub/repos/manage/trusted-content/dvp-program/\" id=\"dkr_read-the-docs-92968\" rel=\"nofollow noopener\" target=\"_blank\">Read the docs</a></li> </ul> <p class=\"wp-block-paragraph\"></p> ]]></content:encoded> </item> <item> <title>17,600 Actions: Agent Security Is a Systems Problem</title> <link>https://www.docker.com/blog/ai-agent-security-systems-problem/</link> <dc:creator><![CDATA[Jin Kim]]></dc:creator> <pubDate>Tue, 18 Aug 2026 16:00:00 +0000</pubDate> <category><![CDATA[Community]]></category> <category><![CDATA[Company]]></category> <category><![CDATA[Engineering]]></category> <category><![CDATA[Security]]></category> <category><![CDATA[Solutions]]></category> <category><![CDATA[AI Agent]]></category> <category><![CDATA[AI/ML]]></category> <category><![CDATA[DHI]]></category> <category><![CDATA[Docker]]></category> <category><![CDATA[Docker AI Governance]]></category> <category><![CDATA[Docker Hardened Images]]></category> <category><![CDATA[sandboxes]]></category> <category><![CDATA[security]]></category> <guid isPermaLink=\"false\">https://www.docker.com/?p=92915</guid> <description><![CDATA[The OpenAI/Hugging Face incident exposed a new challenge for AI agent security. 17,600 attacker actions show why AI agent security can’t rely on human review. Explore the controls needed to constrain, observe, and govern agents at speed.]]></description> <content:encoded><![CDATA[ <p class=\"wp-block-paragraph\"><em>Everyone has been talking about the OpenAI/Hugging Face incident, and I was initially skeptical that Docker had much to add. After several weeks of customer conversations, I think we do. The useful lesson is not that an AI agent escaped a sandbox. It is what 17,600 actions expose about security systems designed for human tempo.</em></p> <p class=\"wp-block-paragraph\">Hugging Face reconstructed approximately 17,600 attacker actions across a four-and-a-half-day campaign in July, including roughly two and a half days inside its infrastructure.</p> <p class=\"wp-block-paragraph\">Put thirty seconds of human review against each action and you get 147 hours of work. Hugging Face grouped those actions into roughly 6,280 clusters; review only those and you still get more than 52 hours. Either way, manual approval and ordinary alert triage were never plausible primary controls for this workload.</p> <p class=\"wp-block-paragraph\">This was not a fundamentally new category of attack. If you have any background in incident response, the sequence is familiar: exploit a reachable service, obtain code execution, collect credentials, escalate privilege, and cross the next trust boundary.</p> <p class=\"wp-block-paragraph\">What was different was the rate, persistence, and ability to carry authority and state across short-lived environments. The agent could fail, rebuild its tooling, recover its communications channels, and continue from another environment without starting the campaign over. The useful mental model is a capable attacker fused with a fuzzer: it can reason about each result and keep probing without fatigue. That is the AI part of the story.</p> <p class=\"wp-block-paragraph\">This is not a commentary on model alignment, and I will offer no opinion here on which model or agent framework you or your organization should use. The security question is familiar: what authority should be given to a workload that can execute code, hold credentials, reach the network, and continue testing paths long after a human would have stopped?</p> <h2 class=\"wp-block-ponyo-heading text-lg\"> What happened </h2> <p class=\"wp-block-paragraph\"></p> <p class=\"wp-block-paragraph\">OpenAI was running internal cyber-capability evaluations against a benchmark called ExploitGym, which tasks agents with finding and exploiting vulnerabilities. The evaluation used reduced refusal behavior and none of the production-grade classifiers a deployed model would normally have.</p> <p class=\"wp-block-paragraph\">The agents did not have direct internet access. They were allowed to install packages through an internally hosted package-registry cache. The agents found a previously unknown vulnerability in that permitted service and used it to reach the open internet.</p> <p class=\"wp-block-paragraph\">The permitted service was the escape path. That’s the important point in the incident.</p> <p class=\"wp-block-paragraph\">From there, the agents escalated privilege inside OpenAI’s research environment, reached a user-hosted CyberGym-style code-execution harness running on an external sandbox, and obtained root inside that harness. The sandbox platform itself was not compromised. Having apparently worked out that Hugging Face might host the benchmark’s reference answers, the agents went after Hugging Face directly, assessing that cheating was the fastest path to a passing score.</p> <p class=\"wp-block-paragraph\">Hugging Face’s reconstruction documents local-file disclosure, code execution through a template engine, cloud metadata access, Kubernetes privilege escalation, exposure of a production secret containing 136 keys, access to the corporate network through a stolen credential, and limited write access to source control. It found no evidence that public models, datasets, packages, or released software were modified, and the customer content accessed was limited to a handful of benchmark-related datasets. That is a good outcome relative to what was possible. It is not evidence that the attack path was harmless.</p> <p class=\"wp-block-paragraph\">The individual weaknesses were familiar: an unsafe processing path, accessible cloud metadata, broad privileges, long-lived credentials, and a shared administrative identity. A capable human attacker could have chained them, too. The difference was the volume of paths tested, the speed with which a failed path was replaced, and the amount of evidence defenders had to interpret while the campaign continued.</p> <p class=\"wp-block-paragraph\">If you want the full blow-by-blow, Hugging Face published a detailed <a href=\"https://huggingface.co/blog/agent-intrusion-technical-timeline\" id=\"dkr_technical-writeup-92915\" rel=\"nofollow noopener\" target=\"_blank\">technical writeup</a> and interactive replay. Both are worth reading.</p> <h2 class=\"wp-block-ponyo-heading text-lg\"> The controls this requires </h2> <p class=\"wp-block-paragraph\"></p> <p class=\"wp-block-paragraph\">That arithmetic, not the novelty of the attack, is what changes the operating model. A human cannot sit in the control loop for thousands of actions at machine speed.</p> <p class=\"wp-block-paragraph\">There are also two related threat models to account for.</p> <p class=\"wp-block-paragraph\">In the first, the agent discovers and exploits a path on its own, as the agents did in this incident. In the second, an external party redirects the agent through a poisoned tool, compromised dependency, malicious document, prompt injection, or attacker-controlled data. In that case, the agent becomes the attack vector.</p> <p class=\"wp-block-paragraph\">The same authority is dangerous in either case. The controls therefore have to govern what enters the environment, which capabilities the agent receives, and what happens when its behavior leaves the expected boundary.</p> <figure class=\"wp-block-table\"><table class=\"has-fixed-layout\"><thead><tr><th><strong>What can go wrong</strong></th><th><strong>Control required</strong></th></tr></thead><tbody><tr><td>Untrusted content attempts to change the agent’s instructions</td><td>Treat external content as data, never authority; preserve provenance and trust boundaries; do not allow retrieved content to modify policy or grant capabilities</td></tr><tr><td>A tool, package, image, or MCP server is poisoned</td><td>Strict allowlisting; pin versions and digests; verify signatures and provenance; require SBOMs; scan and review updates before promotion</td></tr><tr><td>External data becomes executable input</td><td>Use structured and typed tool interfaces; validate and escape arguments; prohibit unsafe shell interpolation and other paths from data to command execution; run commands inside a sandbox and constrain which commands can be invoked</td></tr><tr><td>A permitted service becomes an escape path</td><td>Expose the narrowest operation-specific interface; scope access by task and destination; monitor permitted paths for behavior that diverges from their purpose</td></tr><tr><td>The workload reaches ambient credentials or control-plane services</td><td>Remove ambient credentials; use short-lived, task-scoped workload identity; block metadata and control-plane endpoints the task does not require</td></tr><tr><td>The workload exceeds its intended execution boundary</td><td>Use a hardened isolation boundary; reject privileged workloads, host filesystem mounts, raw device access, and unrestricted host sockets unless explicitly required</td></tr><tr><td>State or authority persists beyond replacement of the worker</td><td>Govern durable write paths; separate read from write authority; correlate identity and activity across runs</td></tr><tr><td>The agent, or an attacker acting through it, crosses into another system</td><td>Require explicit authorization for external and destructive actions; scope credentials to the target operation; make write paths observable and revocable</td></tr><tr><td>Thousands of individually plausible actions hide behavior that has diverged from the task</td><td>Evaluate sequences and bursts against policy and expected behavior; correlate activity across tools and systems; contain at machine speed</td></tr></tbody></table></figure> <p class=\"wp-block-paragraph\"></p> <p class=\"wp-block-paragraph\">The point is not to put human approval in front of every action. That defeats much of the value of using agents and eventually produces approval fatigue. Routine and reversible actions should have very little friction. More sensitive, external, destructive, or unusual actions should receive stronger scrutiny.</p> <p class=\"wp-block-paragraph\">Review and sanitization still matter, particularly for packages, tools, and paths where external data could become a command. But sanitization alone is not a reliable answer to prompt injection. Natural-language content is too ambiguous for us to assume we can always identify and remove the malicious part. The stronger boundary is architectural: untrusted content must not be able to grant itself authority, change policy, or create capabilities the agent did not already have.</p> <p class=\"wp-block-paragraph\">Done well, governance is not what limits agent autonomy. It is what makes it possible to safely give agents more of it.</p> <h2 class=\"wp-block-ponyo-heading text-lg\"> Where Docker fits today, and where we do not </h2> <p class=\"wp-block-paragraph\"></p> <p class=\"wp-block-paragraph\">We are proud to be founding authors of the <a href=\"https://agentbaseline.org/\" id=\"dkr_agent-baseline-92915\" rel=\"nofollow noopener\" target=\"_blank\">Agent Baseline</a>. We worked with other industry experts to distill the problem into six outcomes: Discover, Constrain, Authorize, Observe, Validate, and Respond.</p> <p class=\"wp-block-paragraph\">If <a href=\"https://www.docker.com/products/docker-sandboxes/\" id=\"dkr_docker-sandboxes-92915\">Docker Sandboxes</a> sit in one specific bucket, it’s “Constrain,” but really, we believe they’re foundational, and where you would instrument or implement all six. They give each agent a dedicated microVM and enforceable boundaries around local compute, filesystem access, and network reach, as well as providing the base (and thus ground truth) layer to observe. That is a real and useful layer.</p> <p class=\"wp-block-paragraph\"><a href=\"https://www.docker.com/products/ai-governance/\" id=\"dkr_docker-ai-governance-92915\">Docker AI Governance</a> addresses parts of Authorize and Observe by giving organizations a centralized way to define and enforce controls around agent environments, including network and filesystem policies and access to MCP servers and tools.</p> <p class=\"wp-block-paragraph\">Together, Sandboxes and AI Governance provide a meaningful part of the answer today: a hardened execution environment and centralized policy enforcement around it. They do not repair a vulnerable service the agent is authorized to contact, narrow a credential issued by another system, or replace the customer’s own security architecture. No vendor, Docker included, can claim its technology would have made this particular incident a non-event.</p> <p class=\"wp-block-paragraph\">But a deterministic enforcement boundary is still necessary. It gives an organization one place to apply least capability and least privilege, and one place to observe what the agent was actually allowed to do. If an agent is using a package registry as an egress proxy rather than a package registry, that’s the kind of divergence the telemetry needs to help surface, especially when viewed across a sequence of requests rather than one request at a time.</p> <p class=\"wp-block-paragraph\">The broader problem remains difficult. The useful unit of observation is not always one tool call. It may be a burst of activity, a target, a protocol, a credential, or a pattern visible only across systems. A package request can be normal. Repeatedly probing the service behind it, discovering credentials, and using them to reach another system should change the assessment.</p> <p class=\"wp-block-paragraph\">That’s the agent-security challenge beyond basic containment. We need to constrain authority, but also observe activity at the right granularity, recognize when it deserves more scrutiny, and respond at the same tempo as the agent. For all of us, Docker included, there is still substantial work ahead across observation, validation, and response.</p> <h2 class=\"wp-block-ponyo-heading text-lg\"> The operational tradeoff </h2> <p class=\"wp-block-paragraph\"></p> <p class=\"wp-block-paragraph\">Security, capability, and autonomy all matter, and they will always be in tension. Said differently, none of this is free.</p> <p class=\"wp-block-paragraph\">Short-lived credentials expire during long-running tasks. Narrow egress policies break legitimate package installation. Admission controls reject tools developers assumed they could run. Cross-system detection costs money and produces false positives. A write approval inserted at the wrong point can eliminate most of the productivity the agent was supposed to provide.</p> <p class=\"wp-block-paragraph\">Teams will be tempted to loosen each control until the agent works again. That is understandable. The failure mode created by a strict policy is immediate and visible; the failure mode created by excessive authority remains invisible until an incident.</p> <p class=\"wp-block-paragraph\">The answer is not to remove the controls or ask a human to approve everything. It is to make friction proportional to consequence, test the failure modes, measure the operational cost, and weigh it against the risk and potential blast radius.</p> <h2 class=\"wp-block-ponyo-heading text-lg\"> How I work </h2> <p class=\"wp-block-paragraph\"></p> <p class=\"wp-block-paragraph\">I use agents every day, and I assume that a sufficiently capable agent will eventually try something I did not anticipate (perhaps on a daily basis…).</p> <p class=\"wp-block-paragraph\">For the most part, I do not run one general-purpose agent with access to everything. I use task-focused agents, each packaged as a separate <a href=\"https://docs.docker.com/ai/sandboxes/customize/kits/\" id=\"dkr_kit-92915\" rel=\"nofollow noopener\" target=\"_blank\">kit</a>, built on free <a href=\"https://www.docker.com/products/hardened-images\" id=\"dkr_docker-hardened-images-92915\">Docker Hardened Images</a> and run in Docker Sandboxes.</p> <p class=\"wp-block-paragraph\">Each kit starts with a specific job, then receives only the software, network access, files, credentials, and external capabilities required for that job.</p> <p class=\"wp-block-paragraph\">In most cases, the agent has very few restrictions inside its sandbox. That is intentional. What matters is that god mode inside the sandbox does not become god mode over my laptop, my credentials, or every service I can reach.</p> <p class=\"wp-block-paragraph\">I do a lot of desk research. Those agents can access the open internet. They’re not useful if they can’t. But their image has no compilers, package manager, general-purpose network debugging tools, or development toolchain, and it runs with deliberately limited system permissions. They can retrieve and analyze public information, but have very little machinery with which to turn something they encounter into an exploit or act on another system. They have no reason to hold my source code or production credentials.</p> <p class=\"wp-block-paragraph\">My production coding agent has a much richer environment. It runs pi, can use multiple models, compile code, run tests, and use the tools required for real engineering work. Its network access is restricted to an explicit allow list of services I use, including Docker, GitHub, Snowflake, and Cloudflare. It does not receive arbitrary internet access or arbitrary tools simply because a coding task occasionally needs the network.</p> <p class=\"wp-block-paragraph\">My home kit can interact with an Arduino, but it does not receive direct access to the host or the device. A host-side MCP server brokers the allowed operations. The agent can request a defined Arduino capability through that interface; it cannot turn that permission into general access to every device connected to the machine.</p> <p class=\"wp-block-paragraph\">My development kit is where I experiment. It runs with balanced network access, but no ambient host secrets and no unrestricted access to host files. When it needs Google Workspace, Snowflake, or another host service, host-side daemons broker those calls. The agent sees the capability I have chosen to expose, not the underlying credential or the rest of the service. Those brokers can enforce which operations are allowed and which are blocked.</p> <p class=\"wp-block-paragraph\">These are deliberately different environments. The research agent would be poor at production coding. The coding agent cannot reach every site the research agent can. The home agent cannot turn an Arduino operation into arbitrary host access. The development agent can query a service without possessing the credential that authorizes the query.</p> <p class=\"wp-block-paragraph\">That constraint is the feature.</p> <h2 class=\"wp-block-ponyo-heading text-lg\"> Conclusion: Security at agent speed </h2> <p class=\"wp-block-paragraph\"></p> <p class=\"wp-block-paragraph\">The OpenAI/Hugging Face incident was not the failure of a single boundary. It was a chain of reasonable-seeming permissions and familiar weaknesses that became something very different when an agent could test thousands of paths, preserve state across runs, and carry authority from one system into the next.</p> <p class=\"wp-block-paragraph\">We will not anticipate every vulnerability an agent might find or every way it might combine the access we give it. The architecture cannot depend on perfect agent behavior, perfect software, or a human noticing every dangerous action in time.</p> <p class=\"wp-block-paragraph\">So, the starting point is still least capability and least privilege: give an agent the narrowest interface, credentials, tools, and network access its task requires. Put those controls at a deterministic enforcement boundary. Make the resulting activity observable, not only as isolated requests, but as sequences and patterns across systems. When the behavior leaves the expected envelope, containment has to happen at agent speed.</p> <p class=\"wp-block-paragraph\">Docker Sandboxes and Docker AI Governance provide important parts of that architecture today: hardened execution boundaries and centrally enforced policy around them. They do not secure every service an agent is permitted to contact, and they do not eliminate the need for an organization to decide what authority each agent should have. The broader work across Discover, Constrain, Authorize, Observe, Validate, and Respond is why we helped create the Agent Baseline in the first place.</p> <p class=\"wp-block-paragraph\">The goal is not to build an agent that never tries the wrong thing. The goal is to build a system where trying the wrong thing does not give it the keys to everything else.</p> <p class=\"wp-block-paragraph\"></p> ]]></content:encoded> </item> <item> <title>Coding Agent Horror Stories: The Command You Already Approved</title> <link>https://www.docker.com/blog/coding-agent-horror-stories-the-command-you-already-approved/</link> <dc:creator><![CDATA[Jennifer Kohl]]></dc:creator> <pubDate>Tue, 18 Aug 2026 13:00:00 +0000</pubDate> <category><![CDATA[Engineering]]></category> <category><![CDATA[AI Agent]]></category> <category><![CDATA[Docker Sandboxes]]></category> <category><![CDATA[Sandbox Kit]]></category> <guid isPermaLink=\"false\">https://www.docker.com/?p=92821</guid> <description><![CDATA[Learn how AI coding agents can run attacker code through commands you already approved and how Docker Sandboxes limit what an attack can reach.]]></description> <content:encoded><![CDATA[ <p class=\"wp-block-paragraph\">This is Part 5 of our AI Coding Agent Horror Stories series, a look at real security incidents involving AI coding agents, and how <a href=\"https://www.docker.com/products/docker-sandboxes/\" id=\"dkr_docker-sandboxes-92821\">Docker Sandboxes</a> contain agent execution at the boundary rather than at the command line.</p> <p class=\"wp-block-paragraph\">In <a href=\"https://www.docker.com/blog/ai-coding-agent-horror-stories-security-risks/\" id=\"dkr_part-1-92821\">Part 1</a>, we walked through six categories of AI coding agent failures and why they keep happening. The agent runs as you, with your filesystem permissions and your credentials, and nothing sits between the model&#8217;s decision and the shell&#8217;s execution. <a href=\"https://www.docker.com/blog/coding-agent-horror-stories-the-rm-rf-incident/\" id=\"dkr_part-2-92821\">Part 2</a> went deep on the <code>rm -rf ~/</code> incident. <a href=\"https://www.docker.com/blog/coding-agent-horror-stories-the-agent-that-deleted-production/\" id=\"dkr_part-3-92821\">Part 3</a> moved the same problem into a production cloud environment. <a href=\"https://www.docker.com/blog/coding-agent-horror-stories-the-29-million-secret-problem/\" id=\"dkr_part-4-92821\">Part 4</a> followed the credentials themselves through a supply chain attack. </p> <p class=\"wp-block-paragraph\">This one is about the safety net. Most teams running a coding agent today have some version of a list of commands the agent may run without asking, and the assumption underneath it is that anything dangerous will show up as a prompt you can refuse. In January, researchers at <a href=\"https://www.pillar.security/blog/the-agent-security-paradox-when-trusted-commands-in-cursor-become-attack-vectors\" id=\"dkr_pillar-security-92821\" rel=\"nofollow noopener\" target=\"_blank\">Pillar Security</a> showed that the assumption doesn&#8217;t hold.</p> <h2 class=\"wp-block-heading\">Today&#8217;s Horror Story: The Approval That Ran Something Else</h2> <p class=\"wp-block-paragraph\">On January 14, 2026, researchers at <a href=\"https://www.pillar.security/blog/the-agent-security-paradox-when-trusted-commands-in-cursor-become-attack-vectors\" id=\"dkr_pillar-security-92821-2\" rel=\"nofollow noopener\" target=\"_blank\">Pillar Security</a> disclosed CVE-2026-22708, a flaw in Cursor. When the agent ran in Auto-Run Mode with an allowlist enabled, a handful of shell built-ins executed without appearing in that allowlist and without asking for approval. Anything that could get text in front of the agent, a README or a dependency or an issue comment, could use them to change environment variables silently. A command the developer then approved, something as ordinary as <code>git branch</code>, would run the attacker&#8217;s code instead. <a href=\"https://github.com/cursor/cursor/security/advisories/GHSA-82wg-qcm4-fp2w\" id=\"dkr_cursor-rated-it-high-92821\" rel=\"nofollow noopener\" target=\"_blank\">Cursor rated it High</a> and patched it in version 2.3.</p> <p class=\"wp-block-paragraph\">No memory corruption was involved here and no permission was escalated. The developer was shown an accurate prompt, approved a command that was genuinely harmless, and got arbitrary code execution anyway, because the meaning of that command had been changed a minute earlier by something they were never shown.</p> <p class=\"wp-block-paragraph\">In this issue, you&#8217;ll learn:</p> <ul class=\"wp-block-list\"> <li>How shell built-in slipped past an allowlist that was working exactly as designed</li> <li>Why the attack still worked when the allowlist was completely empty</li> <li>What Docker Sandboxes contain here, and the two things they do not</li> <li>How kits, organisation policy and audit logs cover what a per-laptop allowlist misses</li> </ul> <div class=\"wp-block-ponyo-image\"> <img decoding=\"async\" width=\"1810\" height=\"1126\" src=\"https://www.docker.com/app/uploads/2026/08/image1-1.png\" class=\"fade-in\" alt=\"image1 1\" srcset=\"https://www.docker.com/app/uploads/2026/08/image1-1.png 1810w, https://www.docker.com/app/uploads/2026/08/image1-1-1640x1020.png 1640w, https://www.docker.com/app/uploads/2026/08/image1-1-1536x956.png 1536w, https://www.docker.com/app/uploads/2026/08/image1-1-600x373.png 600w, https://www.docker.com/app/uploads/2026/08/image1-1-250x156.png 250w, https://www.docker.com/app/uploads/2026/08/image1-1-64x40.png 64w\" sizes=\"(max-width: 1810px) 100vw, 1810px\" title=\"- image1 1\"> </div> <p class=\"wp-block-paragraph\"><em>Caption: Comic illustrating how an injected instruction changes environment settings without triggering an approval prompt, so that a command the developer legitimately approves runs the attacker&#8217;s payload instead.</em></p> <h2 class=\"wp-block-heading\">The Problem</h2> <p class=\"wp-block-paragraph\">Typically, programs read settings from their environment when they start up. Git checks one called <code>PAGER</code> to work out which program displays its output, and Python checks one called <code>PYTHONWARNINGS</code>. Nobody thinks about these, which is rather the point. The commands that change them are shell built-ins, and Pillar&#8217;s research names <a href=\"https://www.pillar.security/blog/the-agent-security-paradox-when-trusted-commands-in-cursor-become-attack-vectors\" id=\"dkr_export-typeset-and-declare-92821\" rel=\"nofollow noopener\" target=\"_blank\"><code>export</code>, <code>typeset</code> and <code>declare</code></a> specifically, a detail <a href=\"https://www.scworld.com/news/cursor-vulnerability-enables-stealthy-rce-via-indirect-prompt-injection\" id=\"dkr_reported-independently-at-disclosure-92821\" rel=\"nofollow noopener\" target=\"_blank\">reported independently at disclosure</a>. Built-ins are not programs sitting on disk, and the checker was looking for programs on disk, so they went through without ever being surfaced.</p> <p class=\"wp-block-paragraph\">Which means the whole attack is two lines.</p> <div class=\"wp-block-syntaxhighlighter-code \"><pre class=\"brush: bash; gutter: false; title: ; notranslate\"> # This one runs silently. You are never asked. export PAGER=&quot;open -a Calculator&quot; # This one you are asked about, and you say yes, because obviously. git branch </pre></div> <p class=\"wp-block-paragraph\">Git looked up <code>PAGER</code> to work out how to show the branch list, found the attacker&#8217;s command sitting in it, and ran that instead. Pillar notes this worked even with a completely empty allowlist, which is the most restrictive setting on offer.</p> <p class=\"wp-block-paragraph\">An allowlist checks whether the command in front of it is on the list, which is fine for cutting down interruptions, and nobody wants to approve <code>ls</code> for the ninetieth time in a morning. But the name of a command does not tell you what that command will do. The check reads the name, waves it through, and the setting that decides what actually happens was changed a minute earlier by something the check was never shown.</p> <p class=\"wp-block-paragraph\">Cursor&#8217;s documentation now describes the allowlist as best-effort and warns that bypasses are possible. Pillar went further and argued that agents should be handed full command execution inside an isolated environment, and that the industry ought to deprecate allowlists altogether.</p> <h2 class=\"wp-block-heading\">The Scale of the Problem</h2> <p class=\"wp-block-paragraph\">None of the underlying trick is new. Pillar&#8217;s write-up points back to <a href=\"https://www.elttam.com/blog/env\" id=\"dkr_elttams-2020-research-on-environment-variables-92821\" rel=\"nofollow noopener\" target=\"_blank\">Elttam&#8217;s 2020 research on environment variables</a>, which showed how these settings could be turned into code execution.</p> <p class=\"wp-block-paragraph\">It sat there for six years without troubling anybody very much. Pulling it off meant already being on someone&#8217;s machine, setting several things in the right order, running each step yourself, and anyone with that much access had faster ways to cause damage.</p> <p class=\"wp-block-paragraph\">Then coding agents arrived and removed every one of those obstacles at once. They act on instructions found in files they were told to read, they run several steps in a row without stopping to check, and they run as you. A technique that used to need somebody sitting at your keyboard now arrives in a repository you cloned this morning.</p> <p class=\"wp-block-paragraph\">It is the same shape as the s1ngularity attack from <a href=\"https://www.docker.com/blog/coding-agent-horror-stories-the-29-million-secret-problem/\" id=\"dkr_part-4-92821-2\">Part 4</a>. There, a poisoned package borrowed an agent that was already logged in. Here, poisoned text borrows a command that was already approved. Neither one breaks anything. Both of them use permission that was handed over deliberately, for something nobody intended.</p> <h2 class=\"wp-block-heading\">Technical Breakdown: How the Attack Works</h2> <div class=\"wp-block-ponyo-image\"> <img decoding=\"async\" width=\"579\" height=\"668\" src=\"https://www.docker.com/app/uploads/2026/08/image2.png\" class=\"fade-in\" alt=\"image2\" srcset=\"https://www.docker.com/app/uploads/2026/08/image2.png 579w, https://www.docker.com/app/uploads/2026/08/image2-250x288.png 250w, https://www.docker.com/app/uploads/2026/08/image2-64x74.png 64w\" sizes=\"(max-width: 579px) 100vw, 579px\" title=\"- image2\"> </div> <p class=\"wp-block-paragraph\"><em>Caption: Diagram showing how an injected instruction changes the shell environment out of sight, so that an allowlisted command carries the attacker&#8217;s payload when the developer approves it.</em></p> <p class=\"wp-block-paragraph\">The attack has two halves, and the split between them is the entire trick.</p> <h3 class=\"wp-block-heading\">1. The half you never see</h3> <p class=\"wp-block-paragraph\">The agent reads a file it was asked to read, and that file contains an instruction meant for the agent rather than for you. Built-ins then quietly set the environment. Nothing appears on your screen.</p> <p class=\"wp-block-paragraph\">Pillar demonstrated a longer version of this, chaining several settings together, <code>PYTHONWARNINGS</code>, <code>BROWSER</code>, and <code>PERL5OPT</code> among them, so that every later <code>python3</code> command on that machine would run attacker code. The details differ, but the principle is the same: change what a program reads at startup, and you change what it does.</p> <h3 class=\"wp-block-heading\">2. The half you approve</h3> <p class=\"wp-block-paragraph\">Then you run <code>git branch</code> or <code>python3 script.py</code>, or the agent runs it for you under your allowlist. These are the commands people add to allowlists to stop the constant interrupting, so the better tuned your list is, the more reliably the trigger fires. The payload runs with your permissions.</p> <p class=\"wp-block-paragraph\">Some variants skip the approval altogether. One writes extra lines into <code>~/.zshrc</code>, so the code runs again every time you open a terminal. You could finish the project, delete the repository, and still be running it next month.</p> <h2 class=\"wp-block-heading\">The Impact</h2> <p class=\"wp-block-paragraph\">The full chain in Pillar&#8217;s research ends with the victim&#8217;s SSH private keys leaving the machine.</p> <p class=\"wp-block-paragraph\">Work backwards and the whole thing started with a piece of text in a file, read by an agent doing exactly what it was asked to do. No memory bug. No privilege escalation. Nothing in any log that looks the slightest bit out of place.</p> <p class=\"wp-block-paragraph\">Pillar reported it in August 2025 and the fix shipped that January. Cursor engaged with the report and made a real change, so anything the parser cannot classify now requires approval, which closes the paths that were demonstrated. Five months is a fair measure of how awkward this is to fix at the layer where it was found rather than a complaint about the vendor.</p> <p class=\"wp-block-paragraph\">The wider problem has not gone anywhere, because it was never really about shell built-ins. It is about a check that studies the command while somebody rearranges the furniture around it.</p> <div class=\"wp-block-ponyo-image\"> <img decoding=\"async\" width=\"1999\" height=\"812\" src=\"https://www.docker.com/app/uploads/2026/08/image4.png\" class=\"fade-in\" alt=\"image4\" srcset=\"https://www.docker.com/app/uploads/2026/08/image4.png 1999w, https://www.docker.com/app/uploads/2026/08/image4-1640x666.png 1640w, https://www.docker.com/app/uploads/2026/08/image4-1536x624.png 1536w, https://www.docker.com/app/uploads/2026/08/image4-600x244.png 600w, https://www.docker.com/app/uploads/2026/08/image4-250x102.png 250w, https://www.docker.com/app/uploads/2026/08/image4-64x26.png 64w\" sizes=\"(max-width: 1999px) 100vw, 1999px\" title=\"- image4\"> </div> <p class=\"wp-block-paragraph\"><em>Caption: Diagram showing the same payload running inside the microVM, and what it can and cannot reach from there.</em></p> <h2 class=\"wp-block-heading\">How Docker Sandboxes Contain This at the Execution Layer</h2> <p class=\"wp-block-paragraph\"><a href=\"https://docs.docker.com/ai/sandboxes/\" id=\"dkr_docker-sandboxes-92821-2\" rel=\"nofollow noopener\" target=\"_blank\">Docker Sandboxes</a> run AI coding agents in isolated microVMs, each with its own kernel, filesystem, and deny-by-default network, so a compromised dependency an agent pulls cannot reach the host, its credentials, or other workloads. Inside that box the agent can run anything, including with sudo, which is exactly what Pillar recommends. There is no allowlist to slip past. We made the longer argument for why a shared kernel is the wrong shape for this in <a href=\"https://www.docker.com/blog/untrusted-autonomous-workload-ai-sandboxes/\" id=\"dkr_the-untrusted-autonomous-workload-92821\">The Untrusted Autonomous Workload</a>.</p> <p class=\"wp-block-paragraph\">So run the same attack again, this time in a sandbox, and watch where it gets to.</p> <p class=\"wp-block-paragraph\">The injection still lands. The environment gets changed, <code>git branch</code> still triggers it, and the payload runs. Nothing about a sandbox stops that. Then the payload goes looking for your SSH key and does not find one. Your home directory sits on the other side of the boundary, so there is no <code>~/.ssh/id_rsa</code> inside the box to copy.</p> <p class=\"wp-block-paragraph\">It can still use the key. Sandboxes forwards an SSH agent socket into the box so that ordinary work like <code>git push</code> keeps working, which means code inside can ask that agent to authenticate on its behalf. It cannot take the key anywhere, but it can borrow it for as long as the sandbox runs. Your network policy is what limits that, since SSH needs a rule naming the exact destination address and port before it connects to anything.</p> <p class=\"wp-block-paragraph\">The <code>~/.zshrc</code> trick fails outright, because that file lives on your host and a poisoned copy written inside the box disappears along with the box.</p> <p class=\"wp-block-paragraph\">Getting data out is harder than people expect. HTTP and HTTPS leave only through a proxy on your host that checks every request against your rules, anything else over TCP needs a rule naming the address and port, and UDP and ICMP are blocked outright.</p> <p class=\"wp-block-paragraph\">Two caveats, both stated plainly in <a href=\"https://docs.docker.com/ai/sandboxes/security/\" id=\"dkr_dockers-security-documentation-92821\" rel=\"nofollow noopener\" target=\"_blank\">Docker&#8217;s security documentation</a>. The first is your workspace, which is live on your host by default, so Git hooks and <code>Makefile</code> targets are still within reach and a poisoned hook will not turn up in <code>git diff</code>. Running with <code>--clone</code> hands the agent its own copy.</p> <p class=\"wp-block-paragraph\">The second is the shared agent skills store. Supported agents mount the same host-side store read-write unless you opt out at creation time, which is what lets an agent refine a skill and keep it. Every sandbox sharing that store sits inside one trust boundary, so a skill modified inside one becomes an input to the next that loads it. The store is sandbox state though, and a modified skill does not by itself execute on your host, so the risk runs sandbox to sandbox rather than sandbox to host.</p> <p class=\"wp-block-paragraph\">Isolation has its own seams. In July, Pillar published <a href=\"https://www.pillar.security/blog/prompt-injection-leads-to-rce-and-sandbox-escape-in-antigravity\" id=\"dkr_a-series-of-sandbox-escapes-92821\" rel=\"nofollow noopener\" target=\"_blank\">a series of sandbox escapes</a> across four coding agents, and the mechanism was never a broken sandbox but a file written inside one that a tool outside later trusted. Both caveats above are that shape.</p> <p class=\"wp-block-paragraph\">None of this stops the injection. It changes what the injection can get to, which is the only part of this problem with a dependable answer.</p> <h2 class=\"wp-block-heading\">Codify the Boundary with Kits</h2> <div class=\"wp-block-ponyo-image\"> <img decoding=\"async\" width=\"998\" height=\"335\" src=\"https://www.docker.com/app/uploads/2026/08/image3.png\" class=\"fade-in\" alt=\"image3\" srcset=\"https://www.docker.com/app/uploads/2026/08/image3.png 998w, https://www.docker.com/app/uploads/2026/08/image3-600x201.png 600w, https://www.docker.com/app/uploads/2026/08/image3-250x84.png 250w, https://www.docker.com/app/uploads/2026/08/image3-64x21.png 64w\" sizes=\"(max-width: 998px) 100vw, 998px\" title=\"- image3\"> </div> <p class=\"wp-block-paragraph\"><em>Caption: Diagram showing how a kit declares an agent&#8217;s tools, files and network rules, while real credentials stay on the host and are injected by the forward proxy on the way out.</em></p> <p class=\"wp-block-paragraph\">The allowlist failed here partly because it is a list, edited on each laptop, that an injection can reach around. <a href=\"https://docs.docker.com/ai/sandboxes/customize/kits/\" id=\"dkr_kits-92821\" rel=\"nofollow noopener\" target=\"_blank\">Kits</a> are Docker&#8217;s answer to the editing-on-each-laptop half of that.</p> <p class=\"wp-block-paragraph\">A kit is a declarative YAML artifact that <a href=\"https://docs.docker.com/reference/cli/sbx/kit/\" id=\"dkr_extends-a-sandbox-agent-with-credentials-network-policies-environment-variables-startup-commands-and-files-92821\" rel=\"nofollow noopener\" target=\"_blank\">extends a sandbox agent with credentials, network policies, environment variables, startup commands and files</a>. Rather than every developer maintaining a personal allowlist, you write the boundary once, deny-by-default network plus only the destinations a task genuinely needs, and hand the same kit to everybody. It gets reviewed, versioned and diffed like any other file in the repository. The <a href=\"https://docs.docker.com/ai/sandboxes/customize/kit-reference/\" id=\"dkr_kit-spec-reference-92821\" rel=\"nofollow noopener\" target=\"_blank\">kit spec reference</a> covers the fields, and <a href=\"https://github.com/docker/sbx-kits-contrib\" id=\"dkr_dockersbx-kits-contrib-92821\" rel=\"nofollow noopener\" target=\"_blank\">docker/sbx-kits-contrib</a> has working examples.</p> <p class=\"wp-block-paragraph\">This lands directly on the SSH question above. A forwarded SSH agent is a live credential limited only by network policy, so leaving that policy to whoever remembers to run <code>sbx policy deny</code> is the same per-laptop weak point this whole post has been complaining about. A kit can bake the network rule in, so untrusted work has no SSH egress unless the destination was declared up front.</p> <h2 class=\"wp-block-heading\">What This Looks Like in Practice</h2> <p class=\"wp-block-paragraph\">The vulnerability is in the editor, so what you want is the setup that puts the editor&#8217;s terminal inside the box. Cursor is built on VS Code and connects the same way, over Remote &#8211; SSH, with the editor staying on your machine while files, terminals and extensions run in the sandbox. You will need Docker Sandboxes 0.37.0 or later, SSH access configured, and Cursor&#8217;s Remote &#8211; SSH support installed. The <a href=\"https://docs.docker.com/ai/sandboxes/integrations/cursor/\" id=\"dkr_cursor-integration-guide-92821\" rel=\"nofollow noopener\" target=\"_blank\">Cursor integration guide</a> has the full walkthrough.</p> <div class=\"wp-block-syntaxhighlighter-code \"><pre class=\"brush: plain; gutter: false; title: ; notranslate\"> # One-time setup: configure your SSH client for sandboxes. sbx setup ssh # Check the sandbox is reachable, then open the Command Palette, # run Remote-SSH: Connect to Host, and enter &amp;lt;name&amp;gt;.sbx ssh demo.sbx # See what this sandbox is currently allowed to reach. sbx policy ls # Shut egress down and open only what the task needs. sbx policy deny network &quot;**&quot; sbx policy allow network &quot;github.com,registry.npmjs.org&quot; </pre></div> <p class=\"wp-block-paragraph\">Those last two commands come with a catch. If your organisation has<a href=\"https://www.docker.com/products/ai-governance/\" id=\"dkr_-governance-92821\"> governance</a> switched on, the org policy replaces local policy and <code>sbx policy allow</code> and <code>sbx policy deny</code> will have no effect on your machine. You can spot it in the output of <code>sbx policy ls</code>, which begins with a <code>Governance: Managed by &lt;org&gt;</code> line when that is the case. Depending on how admins scope things, some rule types may be delegated back to local control, but a local allow will never beat an organisation-level deny.</p> <p class=\"wp-block-paragraph\">Same editor, same agent, same allowlist, same payload. All that changed is which machine the terminal is on.</p> <figure class=\"wp-block-table is-style-stripes\"><table class=\"has-fixed-layout\"><thead><tr><th class=\"has-text-align-left\" data-align=\"left\">What happens</th><th class=\"has-text-align-left\" data-align=\"left\">On your laptop</th><th class=\"has-text-align-left\" data-align=\"left\">Inside a sandbox</th></tr></thead><tbody><tr><td class=\"has-text-align-left\" data-align=\"left\">The payload runs</td><td class=\"has-text-align-left\" data-align=\"left\">Yes</td><td class=\"has-text-align-left\" data-align=\"left\">Yes</td></tr><tr><td class=\"has-text-align-left\" data-align=\"left\">Where it runs</td><td class=\"has-text-align-left\" data-align=\"left\">Your machine, as you</td><td class=\"has-text-align-left\" data-align=\"left\">A microVM with its own kernel</td></tr><tr><td class=\"has-text-align-left\" data-align=\"left\">Your SSH key file</td><td class=\"has-text-align-left\" data-align=\"left\">Can be read and copied</td><td class=\"has-text-align-left\" data-align=\"left\">Not there</td></tr><tr><td class=\"has-text-align-left\" data-align=\"left\">SSH authentication</td><td class=\"has-text-align-left\" data-align=\"left\">Available, key included</td><td class=\"has-text-align-left\" data-align=\"left\">Available, key stays outside</td></tr><tr><td class=\"has-text-align-left\" data-align=\"left\">The ~/.zshrc trick</td><td class=\"has-text-align-left\" data-align=\"left\">Persists indefinitely</td><td class=\"has-text-align-left\" data-align=\"left\">Gone with the sandbox</td></tr><tr><td class=\"has-text-align-left\" data-align=\"left\">Sending data out</td><td class=\"has-text-align-left\" data-align=\"left\">Open by default</td><td class=\"has-text-align-left\" data-align=\"left\">Only where policy allows</td></tr><tr><td class=\"has-text-align-left\" data-align=\"left\">Who sets the rules</td><td class=\"has-text-align-left\" data-align=\"left\">Each developer</td><td class=\"has-text-align-left\" data-align=\"left\">The organisation</td></tr><tr><td class=\"has-text-align-left\" data-align=\"left\">Evidence afterwards</td><td class=\"has-text-align-left\" data-align=\"left\">None</td><td class=\"has-text-align-left\" data-align=\"left\">A logged policy decision</td></tr></tbody></table></figure> <p class=\"wp-block-paragraph\"></p> <h2 class=\"wp-block-heading\">Making This Hold Across a Team</h2> <p class=\"wp-block-paragraph\">A kit gets the boundary out of one developer&#8217;s head and into a file the team shares, but a file can still be ignored or edited on the machine that matters. <a href=\"https://www.docker.com/products/ai-governance/\" id=\"dkr_docker-ai-governance-92821\">Docker AI Governance</a> moves the settings up one more level. Network and filesystem rules are defined once by your admins and reach developers through the login they already use, so there is nothing to configure per machine and nobody quietly reopening what security closed. A shared kit is the boundary as a suggestion. Governance is the boundary as a ceiling.</p> <p class=\"wp-block-paragraph\">The part that matters most for this story is the record it keeps. What made CVE-2026-22708 work was that the first half was invisible, with no prompt and nothing written down anywhere you would think to look. Under governance every policy decision produces an event carrying the user, the timestamp and the rule that fired, and those events <a href=\"https://www.docker.com/blog/docker-ai-governance-audit-logs-now-where-your-security-team-already-works/\" id=\"dkr_stream-into-whatever-siem-your-security-team-already-uses-92821\">stream into whatever SIEM your security team already uses</a>.</p> <p class=\"wp-block-paragraph\">So an attack that succeeds inside the sandbox and then reaches for somewhere it should not leaves a trail behind it. That is a good deal better than a check that finds nothing wrong and mentions it to nobody.</p> <h2 class=\"wp-block-heading\">Best Practices</h2> <p class=\"wp-block-paragraph\">1. <strong>Treat </strong><code><strong>export</strong></code><strong> like any other command.</strong> Anything that changes environment settings can change what your next command does, even when that next command is on your allowlist.</p> <p class=\"wp-block-paragraph\">2. <strong>Do not mistake an allowlist for a boundary.</strong> It reduces interruptions. The vendor documentation now says outright that it is best-effort and not a security guarantee.</p> <p class=\"wp-block-paragraph\">3. <strong>Isolate before the first command, not after something looks wrong.</strong> Untrusted means anything you did not write and have not read, which covers most of a dependency tree.</p> <p class=\"wp-block-paragraph\">4. <strong>Use </strong><code><strong>--clone</strong></code><strong> for code you have not vetted, and opt out of the shared skills store.</strong> Otherwise Git hooks and build scripts stay live on your host, a poisoned hook will not appear in <code>git diff</code>, and a skill modified inside one sandbox is waiting for the next sandbox that loads it.</p> <p class=\"wp-block-paragraph\">5. <strong>Remember a forwarded SSH agent is a live credential.</strong> The key file staying on your machine is not the same as the key being unusable, so restrict egress for untrusted work.</p> <p class=\"wp-block-paragraph\">6. <strong>Read your own policy.</strong> Run <code>sbx policy ls</code>. Deny-by-default with a long allow list is closer to allow-by-default than it looks.</p> <h2 class=\"wp-block-heading\">Take Action</h2> <ul class=\"wp-block-list\"> <li><strong>Install Docker Sandboxes.</strong> Visit the <a href=\"https://docs.docker.com/ai/sandboxes/\" id=\"dkr_docker-sandboxes-documentation-92821\" rel=\"nofollow noopener\" target=\"_blank\">Docker Sandboxes documentation</a> to install <code>sbx</code> and run your first agent inside a microVM.</li> <li><strong>Connect your editor.</strong> The <a href=\"https://docs.docker.com/ai/sandboxes/integrations/cursor/\" id=\"dkr_remote---ssh-integration-92821\" rel=\"nofollow noopener\" target=\"_blank\">Remote &#8211; SSH integration</a> puts your terminals inside the boundary while the editor stays where it is, so your workflow does not really change.</li> <li><strong>Codify the boundary with a kit. </strong><a href=\"https://docs.docker.com/ai/sandboxes/customize/kits/\" id=\"dkr_define-the-network-and-credential-rules-92821\" rel=\"nofollow noopener\" target=\"_blank\">Define the network and credential rules</a> your team needs once, and hand the same artifact to everybody instead of a personal allowlist.</li> <li><strong>Read the security model. </strong><a href=\"https://docs.docker.com/ai/sandboxes/security/\" id=\"dkr_the-documentation-92821\" rel=\"nofollow noopener\" target=\"_blank\">The documentation</a> is straight about what is isolated and what is not, including the workspace and shared skills store behaviour that <code>--clone</code> and the opt-out flag change.</li> <li><strong>Turn on audit logging.</strong> <a href=\"https://www.docker.com/products/ai-governance/\" id=\"dkr_docker-ai-governance-92821-2\">Docker AI Governance</a> streams policy decisions into your SIEM, which turns a silent bypass into something somebody can actually investigate.</li> </ul> <h2 class=\"wp-block-heading\">Conclusion</h2> <p class=\"wp-block-paragraph\">The uncomfortable thing about CVE-2026-22708 is that nobody in the story did anything wrong.</p> <p class=\"wp-block-paragraph\">Cursor built an allowlist, which is what everyone asked for. The developer approved <code>git branch</code>, which any of us would have approved. The check inspected the command and found it acceptable, which is exactly its job. The attack worked anyway.</p> <p class=\"wp-block-paragraph\">Getting an agent to correctly judge every instruction it reads is a problem that gets harder as agents get more capable, and it has no clean ending. Limiting what an agent can reach is a problem we solved a long time ago. The more useful move is to stop needing the first one, and to write down what the agent may reach as an artifact you can review, rather than a list each laptop keeps for itself.</p> <p class=\"wp-block-paragraph\"><em>Coming up in our series: Issue 6 looks at the ClawHub infostealer campaign, where malicious skills reached developer machines through a marketplace ranking exploit, and at what sandboxed skill execution, and that shared skills store, change about a registry you cannot personally audit.</em></p> <h3 class=\"wp-block-heading\">Learn more</h3> <ul class=\"wp-block-list\"> <li><strong>Run agents safely with Docker Sandboxes: </strong><a href=\"https://docs.docker.com/ai/sandboxes/\" id=\"dkr_visit-the-docker-sandboxes-documentation-92821\" rel=\"nofollow noopener\" target=\"_blank\">Visit the Docker Sandboxes documentation</a> to get started.</li> <li><strong>Understand the security model:</strong> <a href=\"https://docs.docker.com/ai/sandboxes/security/\" id=\"dkr_trust-boundaries-and-isolation-layers-92821\" rel=\"nofollow noopener\" target=\"_blank\">Trust boundaries and isolation layers</a>, including what is and is not isolated by default.</li> <li><strong>Customize sandboxes with kits:</strong> <a href=\"https://docs.docker.com/ai/sandboxes/customize/\" id=\"dkr_extend-an-agent-with-tools-credentials-and-network-rules-92821\" rel=\"nofollow noopener\" target=\"_blank\">Extend an agent with tools, credentials, and network rules</a> as a declarative artifact.</li> <li><strong>Govern agents across a team:</strong> <a href=\"https://www.docker.com/products/ai-governance/\" id=\"dkr_docker-ai-governance-92821-3\">Docker AI Governance</a> for centrally defined sandbox, network and MCP policy with structured audit events.</li> <li><strong>Read the MCP Horror Stories series:</strong><a href=\"https://www.docker.com/blog/mcp-security-issues-threatening-ai-infrastructure/\" id=\"dkr_-start-with-issue-1-92821\"> Start with Issue 1</a> to understand the protocol-layer security risks that complement the agent-layer risks covered here.</li> </ul> <p class=\"wp-block-paragraph\"></p> ]]></content:encoded> </item> <item> <title>Make zero CVEs your new default</title> <link>https://www.docker.com/blog/make-zero-cves-your-new-default/</link> <dc:creator><![CDATA[Vishrut Iyengar]]></dc:creator> <pubDate>Mon, 17 Aug 2026 13:00:00 +0000</pubDate> <category><![CDATA[Community]]></category> <category><![CDATA[Enterprise]]></category> <category><![CDATA[Products]]></category> <category><![CDATA[Security]]></category> <category><![CDATA[Solutions]]></category> <guid isPermaLink=\"false\">https://www.docker.com/?p=92719</guid> <description><![CDATA[Supply-chain attacks have kept escalating while AI writes more of the code you ship. Docker's latest updates bring more software built from source into your images, keep security coverage running past end of life, carry every guarantee through your customized images, and move policy enforcement onto every developer machine.]]></description> <content:encoded><![CDATA[ <p class=\"wp-block-paragraph\">Supply-chain attacks have stopped being isolated incidents somewhere in the past year. The compromises now reach the tools the industry trusts to defend itself, <a href=\"https://www.docker.com/blog/trivy-kics-and-the-shape-of-supply-chain-attacks-so-far-in-2026/\" id=\"dkr_with-trivy-and-kics-among-this-years-targets-92719\">with Trivy and KICS among this year&#8217;s targets</a>. Mark Lechner, Docker&#8217;s Chief Information Security Officer, <a href=\"https://www.docker.com/blog/defending-your-software-supply-chain-what-every-engineering-team-should-do-now/\" id=\"dkr_called-the-latest-wave-a-permanent-shift-in-the-threat-landscape-92719\">called the latest wave ‘a permanent shift in the threat landscape’</a>, and the months since have borne that out. The volume is growing at the same time. <a href=\"https://www.docker.com/blog/docker-sandboxes-run-agents-in-yolo-mode-safely/\" id=\"dkr_over-a-quarter-of-production-code-is-now-ai-authored-92719\">Over a quarter of production code is now AI-authored</a>, and agents pull in dependencies at machine speed. If you run a platform team or a security program, this is the math you are already living with. More code and more images arrive every week, almost none of it written by your own engineers, and all of it has become your responsibility the moment it ships.</p> <p class=\"wp-block-paragraph\">None of this is news to us. Securing the software supply chain is the problem we&#8217;re here to solve. The latest round of updates widens the trusted foundation Docker is building under your supply chain, and tightens how it&#8217;s enforced. More of the software inside your images is now built and patched by Docker itself, and security coverage continues after software reaches end of life. Images can be tailored to your environment without losing their guarantees, and policy enforcement now reaches every developer machine.</p> <h2 class=\"wp-block-ponyo-heading text-lg\"> <strong>A trusted foundation for the whole supply chain</strong><br><br> </h2> <figure class=\"wp-block-image size-full\"><img decoding=\"async\" width=\"2300\" height=\"1474\" src=\"https://www.docker.com/app/uploads/2026/08/Screenshot-2026-08-05-at-14-49-37-Hardened-Images-catalog-Docker-Hub.png\" alt=\"Screenshot 2026 08 05 at 14 49 37 Hardened Images catalog Docker Hub\" class=\"wp-image-92725\" title=\"- Screenshot 2026 08 05 at 14 49 37 Hardened Images catalog Docker Hub\" srcset=\"https://www.docker.com/app/uploads/2026/08/Screenshot-2026-08-05-at-14-49-37-Hardened-Images-catalog-Docker-Hub.png 2300w, https://www.docker.com/app/uploads/2026/08/Screenshot-2026-08-05-at-14-49-37-Hardened-Images-catalog-Docker-Hub-1640x1051.png 1640w, https://www.docker.com/app/uploads/2026/08/Screenshot-2026-08-05-at-14-49-37-Hardened-Images-catalog-Docker-Hub-1536x984.png 1536w, https://www.docker.com/app/uploads/2026/08/Screenshot-2026-08-05-at-14-49-37-Hardened-Images-catalog-Docker-Hub-2048x1313.png 2048w, https://www.docker.com/app/uploads/2026/08/Screenshot-2026-08-05-at-14-49-37-Hardened-Images-catalog-Docker-Hub-600x385.png 600w, https://www.docker.com/app/uploads/2026/08/Screenshot-2026-08-05-at-14-49-37-Hardened-Images-catalog-Docker-Hub-250x160.png 250w, https://www.docker.com/app/uploads/2026/08/Screenshot-2026-08-05-at-14-49-37-Hardened-Images-catalog-Docker-Hub-64x41.png 64w\" sizes=\"(max-width: 2300px) 100vw, 2300px\" /></figure> <p class=\"wp-block-paragraph\"></p> <p class=\"wp-block-paragraph\"></p> <p class=\"wp-block-paragraph\">It all starts from one principle, and Docker Hardened Images was built on it. Security that doesn’t get adopted doesn’t secure anything. The entire catalog is free for every developer, because a secure baseline shouldn’t be a premium feature. Every image is compatible with Alpine and Debian, the distributions your teams already run, and Docker builds every one of them itself, from source. Adoption is a FROM-line change, not a migration project. And every image is independently verifiable, with signed SBOMs (software bills of materials) and SLSA Build Level 3 provenance, so your auditors work from evidence instead of vendor claims.</p> <p class=\"wp-block-paragraph\">A year in, <a href=\"https://www.docker.com/blog/why-we-chose-the-harder-path-docker-hardened-images-one-year-later/\" id=\"dkr_the-numbers-make-the-case-92719\">the numbers make the case</a>. The <a href=\"https://hub.docker.com/hardened-images/catalog\" id=\"dkr_catalog-92719\" rel=\"nofollow noopener\" target=\"_blank\">catalog</a> has grown past 4,000 hardened images, plus MCP servers, Helm charts, and ELS images. It draws more than 3.5 million pulls a week, with over a million builds running regularly to keep all of it patched, and open source projects like <a href=\"https://www.docker.com/resources/how-n8n-uses-docker-hardened-images-webinar/\" id=\"dkr_n8n-run-production-on-dhi-92719\">n8n run production on DHI</a>. The catalog grows the way it always has, driven by what customers request. But the goal was never just a catalog. The goal is one trusted foundation under your whole software supply chain, where the images you run, the packages inside them, the charts that deploy them, and the tools your agents call all carry the same provenance. Security becomes the default from day one, and it holds, without asking your teams to change how they work.</p> <h2 class=\"wp-block-ponyo-heading text-lg\"> Built from source, down to every package </h2> <p class=\"wp-block-paragraph\"></p> <p class=\"wp-block-paragraph\">The hardening keeps reaching deeper into the stack. <a href=\"https://www.docker.com/blog/announcing-docker-hardened-system-packages/\" id=\"dkr_docker-hardened-system-packages-92719\">Docker Hardened System Packages</a> take hardening below the image, to the packages inside it, across both Alpine and Debian, with every package built from upstream source, patched, and maintained by Docker in the same SLSA Build Level 3 pipeline that builds the images themselves. And the repository behind them is open to more than the catalog. DHI Enterprise customers can point apt or apk directly at Docker&#8217;s hardened package repository and bring the same packages into images they build themselves, extending the hardened supply chain beyond the images Docker ships to every image your organization builds.</p> <p class=\"wp-block-paragraph\">The coverage keeps widening. What began with Alpine now spans Debian, with Python, the <a href=\"https://hub.docker.com/hardened-images/catalog\" id=\"dkr_catalogs-92719\" rel=\"nofollow noopener\" target=\"_blank\">catalog&#8217;s</a> most pulled image, among the first to ship fully hardened. The work compounds every week, and the <a href=\"https://dhi.io/deb/debian/main/index.html\" id=\"dkr_debian-92719\" rel=\"nofollow noopener\" target=\"_blank\">Debian</a> and <a href=\"https://dhi.io/apk/alpine/v3.24/main/index.html\" id=\"dkr_alpine-92719\" rel=\"nofollow noopener\" target=\"_blank\">Alpine</a> package lists are public, so you can watch the catalog harden in real time.</p> <p class=\"wp-block-paragraph\">If you&#8217;ve spent time chasing base-image CVEs, you know why this matters. System packages are notorious for slow fixes; a patch can sit waiting on the distribution&#8217;s next release for months or years. Docker doesn&#8217;t wait. We patch at the package level, ahead of upstream when it counts, and the fix lands in every image that uses that package, in one build wave instead of image by image. Entire businesses have been built on delivering community-distribution security updates faster than the community. With DHI, that speed is included.</p> <p class=\"wp-block-paragraph\">The guarantees hold up under inspection, too. Packages you add through DHI customization, tailoring an image to your workloads, come from that same hardened repository, not an unverified public mirror, so they are hardened system packages in their own right and the SLA that covers the base image extends through everything you add. And because one vendor stands behind the image, the packages inside it, the CVE investigation, and the patch, your auditors get a single chain of signed provenance instead of a stack of vendor assurances.</p> <p class=\"wp-block-paragraph\">Your distribution, meanwhile, stays your distribution. Building a hardened package ecosystem from source is a serious engineering commitment, and Docker made it twice, for Alpine and for Debian, so keeping your house standard never costs you your security posture.</p> <h2 class=\"wp-block-ponyo-heading text-lg\"> Patch past end of life </h2> <p class=\"wp-block-paragraph\"></p> <p class=\"wp-block-paragraph\">Production software has a habit of outliving its maintainers. Migrations wait on budgets, dependencies, and test cycles, and CVEs don’t wait with them. That’s the problem <a href=\"https://www.docker.com/products/hardened-images/\" id=\"dkr_dhi-extended-lifecycle-support-els-92719\">DHI Extended Lifecycle Support (ELS)</a> exists for. It keeps end-of-life software patched, with SBOMs and provenance maintained, for up to five more years.</p> <p class=\"wp-block-paragraph\">ELS isn’t limited to a set catalog, either. Docker watches the end-of-life calendar and builds coverage ahead of it, and anything you don’t see, you can request. MinIO is the newest addition. Upstream archived the project in February 2026, yet in the DHI catalog it lives on, patched and hardened, and your migration runs on your schedule instead of upstream’s.</p> <h2 class=\"wp-block-ponyo-heading text-lg\"> Customize at scale, manage as code<br> </h2> <p class=\"wp-block-paragraph\"></p> <p class=\"wp-block-paragraph\">Nobody runs stock images in production. You add CA certificates, agents, and the packages your applications demand. The trouble is that in most of this market, the first change you make is where the vendor’s guarantees end, and everything after it is yours to carry. <a href=\"https://docs.docker.com/dhi/how-to/customize/\" id=\"dkr_dhi-customization-92719\" rel=\"nofollow noopener\" target=\"_blank\">DHI customization</a> works the other way around. You define what your images need, and Docker manages the full lifecycle of your customized images, rebuilding them through the same hardened pipeline on every upstream patch. The SBOM, the attestations, and the SLA travel with the customization instead of dying at it.</p> <p class=\"wp-block-paragraph\">Customization operates at scale, too. Bulk customizations run through the UI, CLI, and API, with YAML configuration and GitHub Actions support, so you can tailor hundreds of repositories in one pass and let the rebuilds take care of themselves. And if your platform runs on Terraform, customization is code as well. The <a href=\"https://registry.terraform.io/providers/docker-hardened-images/dhi/latest\" id=\"dkr_dhi-terraform-provider-92719\" rel=\"nofollow noopener\" target=\"_blank\">DHI Terraform provider</a> mirrors and customizes hardened images with the same pull requests and reviews as the rest of your infrastructure.</p> <p class=\"wp-block-paragraph\">The savings are real infrastructure, not a rounding error. Customers tell us they’ve shut off the CI pipelines that existed only to rebuild images, because Docker rebuilds for them. The blind redeploy cadence goes with those pipelines. You ship an update when a fix actually needs to go out, knowing exactly what changed, instead of rebuilding everything on a schedule and hoping QA catches what moved.</p> <p class=\"wp-block-paragraph\">For organizations whose data-residency requirements keep images inside the EU, EU-hosted customizations arrive in September. Your customized images will live in Docker Hub’s EU region with the same SBOMs, attestations, and SLA as everywhere else. Residency stops being the reason your hardening program waits.</p> <h2 class=\"wp-block-ponyo-heading text-lg\"> Harden beyond base images </h2> <p class=\"wp-block-paragraph\"></p> <p class=\"wp-block-paragraph\">The same standard keeps moving up the stack. The catalog now carries fully supported Helm charts, so your Kubernetes deployments start hardened too. And it carries a growing set of hardened MCP servers, because the tools your agents call deserve the same scrutiny as the images they run on.</p> <h2 class=\"wp-block-ponyo-heading text-lg\"> Govern it all with Docker Scout policy<br> </h2> <p class=\"wp-block-paragraph\"></p> <p class=\"wp-block-paragraph\">Scanning tells you what’s wrong. Policy is how you keep it from shipping. And enforcement is where most supply-chain programs quietly fail, because hardened artifacts only protect you when your teams actually use them. Developers move fast and default to what works, and the developer machine is exactly where the current wave of attacks aims.</p> <p class=\"wp-block-paragraph\"><a href=\"https://docs.docker.com/scout/\" id=\"dkr_docker-scout-92719\" rel=\"nofollow noopener\" target=\"_blank\">Docker Scout</a> policy closes that gap. It evaluates flexible, customizable policies from the CLI and inside CI, and it ships with the same policies Docker uses to verify every hardened image in the catalog. The policies are written in Rego, the industry standard, and they&#8217;re portable, so the same rules that gate a build in your CI travel with your teams to every developer machine in your organization. Gating at the registry matters, but it stops at the registry; developers can route around it all day. Policy that travels to the machine is how you hold every image you run, and every image your teams build, to the bar Docker holds itself to.</p> <p class=\"wp-block-paragraph\">It’s an additive control. It works alongside the scanners you already run, and it’s already in the Docker subscription you have.</p> <h2 class=\"wp-block-ponyo-heading text-lg\"> The foundation is already in your stack<br> </h2> <p class=\"wp-block-paragraph\"></p> <p class=\"wp-block-paragraph\">The supply-chain problem is not going to shrink. More code is coming, agents are becoming contributors, and the patch windows regulators expect keep getting shorter. Point tools won’t carry that weight. A foundation that’s secure by default will, backed by an ecosystem that keeps it that way. That is exactly what <a href=\"https://www.docker.com/solutions/security/\" id=\"dkr_dockers-security-portfolio-92719\">Docker’s security portfolio</a> delivers. Hardened content on the distributions you already run, customization that keeps its guarantees, support that outlasts upstream, and policy you control, from one vendor accountable for all of it.</p> <p class=\"wp-block-paragraph\">And none of it asks you to adopt something new. It’s all in the Docker you already run. Your builds, tools, and pipelines stay the same. Your CVE count doesn’t.</p> <p class=\"wp-block-paragraph\">Browse the <a href=\"https://hub.docker.com/hardened-images/catalog\" id=\"dkr_dhi-catalog-92719\" rel=\"nofollow noopener\" target=\"_blank\">DHI catalog</a> and pull your first hardened image today. And if you want the full story, how all of this works together, with your questions answered live, join our live webinar in early September. We’d love to see you there.</p> <p class=\"wp-block-paragraph\"></p> ]]></content:encoded> </item> </channel> </rss>"