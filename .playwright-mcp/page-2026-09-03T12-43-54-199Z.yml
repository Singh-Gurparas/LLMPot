        - separator [ref=f26e124]
      - paragraph [ref=f26e125]: Docker is an open platform for developing, shipping, and running applications. Docker enables you to separate your applications from your infrastructure so you can deliver software quickly. With Docker, you can manage your infrastructure in the same ways you manage your applications. By taking advantage of Docker's methodologies for shipping, testing, and deploying code, you can significantly reduce the delay between writing code and running it in production.
      - heading [level=2] [ref=f26e126]:
        - link "The Docker platform" [ref=f26e127] [cursor=pointer]:
          - /url: "#the-docker-platform"
      - paragraph [ref=f26e128]: Docker provides the ability to package and run an application in a loosely isolated environment called a container. The isolation and security let you run many containers simultaneously on a given host. Containers are lightweight and contain everything needed to run the application, so you don't need to rely on what's installed on the host. You can share containers while you work, and be sure that everyone you share with gets the same container that works in the same way.
      - paragraph [ref=f26e129]: "Docker provides tooling and a platform to manage the lifecycle of your containers:"
      - list [ref=f26e130]:
        - listitem [ref=f26e131]: Develop your application and its supporting components using containers.
        - listitem [ref=f26e132]: The container becomes the unit for distributing and testing your application.
        - listitem [ref=f26e133]: When you're ready, deploy your application into your production environment, as a container or an orchestrated service. This works the same whether your production environment is a local data center, a cloud provider, or a hybrid of the two.
      - heading [level=2] [ref=f26e134]:
        - link "What can I use Docker for?" [ref=f26e135] [cursor=pointer]:
          - /url: "#what-can-i-use-docker-for"
      - heading [level=3] [ref=f26e136]:
        - link "Fast, consistent delivery of your applications" [ref=f26e137] [cursor=pointer]:
          - /url: "#fast-consistent-delivery-of-your-applications"
      - paragraph [ref=f26e138]: Docker streamlines the development lifecycle by allowing developers to work in standardized environments using local containers which provide your applications and services. Containers are great for continuous integration and continuous delivery (CI/CD) workflows.
      - paragraph [ref=f26e139]: "Consider the following example scenario:"
      - list [ref=f26e140]:
        - listitem [ref=f26e141]: Your developers write code locally and share their work with their colleagues using Docker containers.
        - listitem [ref=f26e142]: They use Docker to push their applications into a test environment and run automated and manual tests.
        - listitem [ref=f26e143]: When developers find bugs, they can fix them in the development environment and redeploy them to the test environment for testing and validation.
        - listitem [ref=f26e144]: When testing is complete, getting the fix to the customer is as simple as pushing the updated image to the production environment.
      - heading [level=3] [ref=f26e145]:
        - link "Responsive deployment and scaling" [ref=f26e146] [cursor=pointer]:
          - /url: "#responsive-deployment-and-scaling"
      - paragraph [ref=f26e147]: Docker's container-based platform allows for highly portable workloads. Docker containers can run on a developer's local laptop, on physical or virtual machines in a data center, on cloud providers, or in a mixture of environments.
      - paragraph [ref=f26e148]: Docker's portability and lightweight nature also make it easy to dynamically manage workloads, scaling up or tearing down applications and services as business needs dictate, in near real time.
      - heading [level=3] [ref=f26e149]:
        - link "Running more workloads on the same hardware" [ref=f26e150] [cursor=pointer]:
          - /url: "#running-more-workloads-on-the-same-hardware"
      - paragraph [ref=f26e151]: Docker is lightweight and fast. It provides a viable, cost-effective alternative to hypervisor-based virtual machines, so you can use more of your server capacity to achieve your business goals. Docker is perfect for high density environments and for small and medium deployments where you need to do more with fewer resources.
      - heading [level=2] [ref=f26e152]:
        - link "Docker architecture" [ref=f26e153] [cursor=pointer]:
          - /url: "#docker-architecture"
      - paragraph [ref=f26e154]: Docker uses a client-server architecture. The Docker client talks to the Docker daemon, which does the heavy lifting of building, running, and distributing your Docker containers. The Docker client and daemon can run on the same system, or you can connect a Docker client to a remote Docker daemon. The Docker client and daemon communicate using a REST API, over UNIX sockets or a network interface. Another Docker client is Docker Compose, that lets you work with applications consisting of a set of containers.
      - figure:
        - img "Docker Architecture diagram"
      - heading [level=3] [ref=f26e155]:
        - link "The Docker daemon" [ref=f26e156] [cursor=pointer]:
          - /url: "#the-docker-daemon"
      - paragraph [ref=f26e157]:
        - text: The Docker daemon (
        - code [ref=f26e158]: dockerd
        - text: ) listens for Docker API requests and manages Docker objects such as images, containers, networks, and volumes. A daemon can also communicate with other daemons to manage Docker services.
      - heading [level=3] [ref=f26e159]:
        - link "The Docker client" [ref=f26e160] [cursor=pointer]:
          - /url: "#the-docker-client"
      - paragraph [ref=f26e161]:
        - text: The Docker client (
        - code [ref=f26e162]: docker
        - text: ) is the primary way that many Docker users interact with Docker. When you use commands such as
        - code [ref=f26e163]: docker run
        - text: ", the client sends these commands to"
        - code [ref=f26e164]: dockerd
        - text: ", which carries them out. The"
        - code [ref=f26e165]: docker
        - text: command uses the Docker API. The Docker client can communicate with more than one daemon.
      - heading [level=3] [ref=f26e166]:
        - link "Docker Desktop" [ref=f26e167] [cursor=pointer]:
          - /url: "#docker-desktop"
      - paragraph [ref=f26e168]:
        - text: Docker Desktop is an easy-to-install application for your Mac, Windows, or Linux environment that enables you to build and share containerized applications and microservices. Docker Desktop includes the Docker daemon (
        - code [ref=f26e169]: dockerd
        - text: ), the Docker client (
        - code [ref=f26e170]: docker
        - text: ), Docker Compose, Docker Content Trust, Kubernetes, and Credential Helper. For more information, see
        - link "Docker Desktop" [ref=f26e171] [cursor=pointer]:
          - /url: https://docs.docker.com/desktop/
        - text: .
      - heading [level=3] [ref=f26e172]:
        - link "Docker registries" [ref=f26e173] [cursor=pointer]:
          - /url: "#docker-registries"
      - paragraph [ref=f26e174]: A Docker registry stores Docker images. Docker Hub is a public registry that anyone can use, and Docker looks for images on Docker Hub by default. You can even run your own private registry.
      - paragraph [ref=f26e175]:
        - text: When you use the
        - code [ref=f26e176]: docker pull
        - text: or
        - code [ref=f26e177]: docker run
        - text: commands, Docker pulls the required images from your configured registry. When you use the
        - code [ref=f26e178]: docker push
        - text: command, Docker pushes your image to your configured registry.
      - heading [level=3] [ref=f26e179]:
        - link "Docker objects" [ref=f26e180] [cursor=pointer]:
          - /url: "#docker-objects"
      - paragraph [ref=f26e181]: When you use Docker, you are creating and using images, containers, networks, volumes, plugins, and other objects. This section is a brief overview of some of those objects.
      - heading [level=4] [ref=f26e182]:
        - link "Images" [ref=f26e183] [cursor=pointer]:
          - /url: "#images"
      - paragraph [ref=f26e184]: An image is a read-only template with instructions for creating a Docker container. Often, an image is based on another image, with some additional customization. For example, you may build an image that is based on the Ubuntu image but includes the Apache web server and your application, as well as the configuration details needed to make your application run.
      - paragraph [ref=f26e185]: You might create your own images or you might only use those created by others and published in a registry. To build your own image, you create a Dockerfile with a simple syntax for defining the steps needed to create the image and run it. Each instruction in a Dockerfile creates a layer in the image. When you change the Dockerfile and rebuild the image, only those layers which have changed are rebuilt. This is part of what makes images so lightweight, small, and fast, when compared to other virtualization technologies.
      - heading [level=4] [ref=f26e186]:
        - link "Containers" [ref=f26e187] [cursor=pointer]:
          - /url: "#containers"
      - paragraph [ref=f26e188]: A container is a runnable instance of an image. You can create, start, stop, move, or delete a container using the Docker API or CLI. You can connect a container to one or more networks, attach storage to it, or even create a new image based on its current state.
      - paragraph [ref=f26e189]: By default, a container is relatively well isolated from other containers and its host machine. You can control how isolated a container's network, storage, or other underlying subsystems are from other containers or from the host machine.
      - paragraph [ref=f26e190]: A container is defined by its image as well as any configuration options you provide to it when you create or start it. When a container is removed, any changes to its state that aren't stored in persistent storage disappear.
      - heading [level=5] [ref=f26e191]:
        - link [ref=f26e192] [cursor=pointer]:
          - /url: "#example-docker-run-command"
          - text: Example
          - code [ref=f26e193]: docker run
          - text: command
      - paragraph [ref=f26e194]:
        - text: The following command runs an
        - code [ref=f26e195]: ubuntu
        - text: container, attaches interactively to your local command-line session, and runs
        - code [ref=f26e196]: /bin/bash
        - text: .
      - generic [ref=f26e199]:
        - button "copy"
        - code [ref=f26e202]:
          - generic [ref=f26e203]: $ docker run -i -t ubuntu /bin/bash
      - paragraph [ref=f26e205]: "When you run this command, the following happens (assuming you are using the default registry configuration):"
      - list [ref=f26e206]:
        - listitem [ref=f26e207]:
          - paragraph [ref=f26e208]:
            - text: If you don't have the
            - code [ref=f26e209]: ubuntu
            - text: image locally, Docker pulls it from your configured registry, as though you had run
            - code [ref=f26e210]: docker pull ubuntu
            - text: manually.
        - listitem [ref=f26e211]:
          - paragraph [ref=f26e212]:
            - text: Docker creates a new container, as though you had run a
            - code [ref=f26e213]: docker container create
            - text: command manually.
        - listitem [ref=f26e214]:
          - paragraph [ref=f26e215]: Docker allocates a read-write filesystem to the container, as its final layer. This allows a running container to create or modify files and directories in its local filesystem.
        - listitem [ref=f26e216]:
          - paragraph [ref=f26e217]: Docker creates a network interface to connect the container to the default network, since you didn't specify any networking options. This includes assigning an IP address to the container. By default, containers can connect to external networks using the host machine's network connection.
        - listitem [ref=f26e218]:
          - paragraph [ref=f26e219]:
            - text: Docker starts the container and executes
            - code [ref=f26e220]: /bin/bash
            - text: . Because the container is running interactively and attached to your terminal (due to the
            - code [ref=f26e221]: "-i"
            - text: and
            - code [ref=f26e222]: "-t"
            - text: flags), you can provide input using your keyboard while Docker logs the output to your terminal.
        - listitem [ref=f26e223]:
          - paragraph [ref=f26e224]:
            - text: When you run
            - code [ref=f26e225]: exit
            - text: to terminate the
            - code [ref=f26e226]: /bin/bash
            - text: command, the container stops but isn't removed. You can start it again or remove it.
      - heading [level=2] [ref=f26e227]:
        - link "The underlying technology" [ref=f26e228] [cursor=pointer]:
          - /url: "#the-underlying-technology"
      - paragraph [ref=f26e229]:
        - text: Docker is written in the
        - link "Go programming language" [ref=f26e230] [cursor=pointer]:
          - /url: https://golang.org/
        - text: and takes advantage of several features of the Linux kernel to deliver its functionality. Docker uses a technology called
        - code [ref=f26e231]: namespaces
        - text: to provide the isolated workspace called the container. When you run a container, Docker creates a set of namespaces for that container.
      - paragraph [ref=f26e232]: These namespaces provide a layer of isolation. Each aspect of a container runs in a separate namespace and its access is limited to that namespace.
      - heading [level=2] [ref=f26e233]:
        - link "Next steps" [ref=f26e234] [cursor=pointer]:
          - /url: "#next-steps"
